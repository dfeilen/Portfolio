<!DOCTYPE html>
<html lang="en">

     env(safe-area-inset-*) below. -->

<!-- Applies the saved theme before the first paint, so a returning visitor
     never watches the page flip palettes on load. -->
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>

<style>
/* ============================================================================
   THE WORDMARK FACE

   Comico, self-hosted from /fonts/. Fontshare's free licence covers web
   use and the download ships these exact webfont files for the purpose.
   The same licence forbids modifying the font, so it is NOT subsetted —
   which is why it's 332 KB for two words. `swap` means Space Mono renders
   immediately and Comico takes over when it arrives, so nothing is ever
   invisible while it loads.
   ============================================================================ */
@font-face{
  font-family:'Comico';
  src:url('fonts/Comico-Regular.woff2') format('woff2'),
      url('fonts/Comico-Regular.woff')  format('woff');
  font-weight:400;          /* the only weight there is — see .name below */
  font-style:normal;
  font-display:swap;
}

/* ============================================================================
   THE INTERFACE FACE — Supreme, self-hosted from /fonts/

   Two files, and the split is deliberate. The roman is the VARIABLE font:
   one 30 KB file covering every weight from Thin to Extrabold, so the
   navigation can be Extrabold and the Information paragraph can be
   Regular without a second download.

   The italic is a separate STATIC file, because Supreme's variable font
   carries a weight axis and nothing else — there is no slant axis. Roman
   and italic are two unrelated outlines as far as the browser is
   concerned, which is the whole reason the hover below is built the way
   it is. See .morph.

   Only Extrabold Italic is shipped; it's the one italic the site uses.
   Fontshare's licence permits web use and forbids modification, so
   neither file is subsetted.
   ============================================================================ */
@font-face{
  font-family:'Supreme';
  src:url('fonts/Supreme-Variable.woff2') format('woff2'),
      url('fonts/Supreme-Variable.woff')  format('woff');
  font-weight:100 800;      /* a range, not a value — this is the variable font */
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Supreme';
  src:url('fonts/Supreme-ExtraboldItalic.woff2') format('woff2'),
      url('fonts/Supreme-ExtraboldItalic.woff')  format('woff');
  font-weight:800;
  font-style:italic;
  font-display:swap;
}

/* ============================================================================
   A SMALL SCALE — four sizes, each with exactly one job.

   The site ran on a single 13px size for a long time. The wordmark broke
   that first, and the larger navigation and category names finish the
   job. Four is still a scale rather than a free-for-all: wordmark,
   category, nav, everything-else. Nothing on the photographs themselves —
   no captions, no titles, no numbers.
   ============================================================================ */
:root{
  --bg:#EAE7E2;
  --fg:#1B1B1C;          /* 13.9:1 */
  --fg-dim:#6B675F;      /* 4.6:1  */
  --sunk:#DEDAD3;

  /* ── THE INTERFACE FACE ────────────────────────────────────────────
     Everything except the wordmark. Swap the one line below to change
     the whole site; the alternatives are loaded in the <head> so you can
     try each without touching anything else. Open _font-options.html to
     see them side by side.

       'Inter'              neutral grotesque — gets out of the way   ← in use
       'DM Sans'            geometric, a little warmer
       'Work Sans'          friendlier, slightly quirky
       'Newsreader'         editorial serif, more voice
       'Space Mono'         what the site used before — technical, cold
     ------------------------------------------------------------------ */
  --ui:'Supreme';
  --font:var(--ui),ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;

  /* A small scale, now that the wordmark has already broken the
     single-size rule. Three sizes, each with one job. */
  --size:15px;                          /* Information, the toggle */
  --nav:clamp(16px,1.45vw,20px);        /* PHOTOGRAPHY, INFORMATION */
  --cat:clamp(26px,3.2vw,42px);         /* the category names */
  --heavy:800;                          /* Extrabold — nav and categories */
  --morph:.2s;                          /* roman to italic on hover */
  --lh:1.45;
  --track:0.01em;

  --edge:clamp(10px,2vw,28px);
  --head-h:clamp(104px,13vh,150px);     /* what the fixed header occupies */
  --pile-w:clamp(120px,19vmin,240px);   /* base tile width on the front page */

  /* One photograph per screen, so it can be far larger than it was when
     frames sat beside each other. Capped by height and by width at once;
     clamp() keeps it tracking the window without growing forever on a
     27" monitor. */
  --imgh:clamp(180px, 78svh, 1100px);
  --imgw:min(88vw, 1600px);

  --ease:cubic-bezier(.4,0,.2,1);
  --fade:520ms;

  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-t:env(safe-area-inset-top,0px);
  --edge-l:calc(var(--edge) + var(--sa-l));
  --edge-r:calc(var(--edge) + var(--sa-r));
}
[data-theme="dark"]{
  --bg:#0a0a0a; --fg:#ffffff; --fg-dim:#8a8a8a; --sunk:#161616;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,p,figure,ul,li,h1,h2{margin:0;padding:0}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

html,body{background:var(--bg)}
body{
  color:var(--fg);
  font-family:var(--font);
  font-size:var(--size);
  line-height:var(--lh);
  letter-spacing:var(--track);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  text-size-adjust:100%;
}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}

a,button{touch-action:manipulation}
a{color:inherit;text-decoration:none}
.dim{color:var(--fg-dim)}

a.h,button.h{transition:color .45s var(--ease)}
a.h:hover,button.h:hover,a.h:focus-visible,button.h:focus-visible{color:var(--fg-dim)}
a.h.on{color:var(--fg-dim)}

.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--fg);color:var(--bg);padding:10px}
.skip:focus{left:0}

/* ============================================================================
   THEME SWITCHING
   Only `body` used to carry a colour transition, so its text faded while
   everything setting a colour of its own snapped. One rule turns a
   transition on for everything, for exactly as long as the switch takes.
   ============================================================================ */
html.theming, html.theming *, html.theming *::before, html.theming *::after{
  transition:background-color .45s var(--ease),
             background-image .45s var(--ease),
             color .45s var(--ease),
             border-color .45s var(--ease),
             outline-color .45s var(--ease) !important;
}

/* ============================================================================
   THE HEADER
   Two centred lines, fixed to the top: the name, and beneath it the two
   destinations. Photographs run to the edges below it, so it carries a
   short wash of background to stay legible over a full-bleed frame.
   ============================================================================ */
.head{
  position:fixed;top:0;left:0;right:0;z-index:50;
  text-align:center;
  padding:calc(18px + var(--sa-t)) var(--edge-r) 20px var(--edge-l);
  background:linear-gradient(to bottom,var(--bg) 55%,transparent);
  pointer-events:none;
}
.head a,.head button{pointer-events:auto}
/* The one deliberate exception to the single type size. A wordmark is
   closer to a mark than to text, and this is the only place it appears.

   font-weight stays at 400. Comico ships Regular only, so asking for 700
   makes the browser synthesise a fake bold — it smears the outlines of a
   marker face and looks noticeably worse than the real thing. The weight
   here comes from the size and from the face itself, which is already
   heavy. The 5° slant is the typeface's own; it isn't italic. */
.head .name{
  display:inline-block;
  font-family:'Comico',var(--font);
  font-size:clamp(26px, 4.4vw, 52px);
  font-weight:400;
  line-height:1.06;
  letter-spacing:.03em;
  padding:0;margin:0;      /* the shared .head a tap padding would skew it */
}
.head .to{display:block;margin-top:10px;font-size:var(--nav);letter-spacing:.05em;
  font-weight:var(--heavy)}
/* Tap targets. 13px of bare text is a 16px-tall target — unusable with a
   thumb. Padding grows the hit area without moving the text a pixel. */
.head a{padding:8px 5px;margin:-8px -5px;display:inline-block}

/* The toggle sits out of the way in the corner rather than joining the
   header, which would break its symmetry. */
.corner{
  position:fixed;right:var(--edge-r);bottom:calc(14px + var(--sa-b));z-index:50;
}
.corner button{padding:12px 6px;margin:-12px -6px;display:inline-block}
/* "Light mode" is 10 characters and "Dark mode" is 9; a reserved width
   stops that one character shifting the corner on every switch. */
#theme{min-width:calc(10ch + 12px);text-align:right}

html.renovating .head .to{display:none}

/* ============================================================================
   VIEWS
   ============================================================================ */
#view{opacity:1;transition:opacity var(--fade) var(--ease)}
#view.out{opacity:0}

/* ============================================================================
   ROMAN → ITALIC ON HOVER

   Supreme's variable font has a weight axis and no slant axis, so the
   browser cannot interpolate roman to italic the way it interpolates a
   weight. They are two separate files of two separate outlines. Supreme's
   italic is a true italic, not a slanted roman — its 'a' is single-storey,
   a different letter entirely — so faking it with transform:skewX() would
   slant the wrong shapes and never show the real thing.

   So the transition is a cross-fade between the two cuts, laid exactly on
   top of one another. The reason that works cleanly here rather than
   looking like a double exposure is that the two cuts set to the same
   width: PHOTOGRAPHY, INFORMATION, Bikes, Running, Singles, Couples and
   A&B are all identical to the pixel, and only Cars differs, by 2.4%.
   The letters slide into their italic forms in place instead of drifting.

   The italic layer is a ::after carrying the same text, which keeps the
   markup to one node and means the roman is what gets selected, read and
   copied. It renders at opacity:0 from the start, so the italic file is
   fetched on load rather than on the first hover — otherwise the first
   pass over a word would fade into a fallback.

   `padding:inherit` plus left/right:0 lands the pseudo's content box
   exactly on the parent's, so the two cuts sit atop each other whatever
   tap padding the element carries.
   ============================================================================ */
.morph{position:relative;display:inline-block;font-weight:var(--heavy)}
.morph>span{display:block;transition:opacity var(--morph) var(--ease)}
.morph::after{
  content:attr(data-t);
  position:absolute;left:0;right:0;top:0;
  padding:inherit;
  font-style:italic;
  font-weight:var(--heavy);
  text-align:inherit;
  opacity:0;
  transition:opacity var(--morph) var(--ease);
  pointer-events:none;
}
/* Hover only. On a touch screen there is no hover state to leave, so the
   italic would stick after a tap and never come back. */
@media (hover:hover) and (pointer:fine){
  .morph:hover>span,.morph:focus-visible>span{opacity:0}
  .morph:hover::after,.morph:focus-visible::after{opacity:1}
}
/* The blanket reduced-motion rule above already collapses this to an
   instant swap rather than removing it — the italic still appears, it
   just doesn't travel there. */

/* ---- The category list ---- */
.cats{min-height:100svh;display:grid;place-items:center;
  padding:0 var(--edge-r) 0 var(--edge-l)}
.cats-inner{display:grid;justify-items:center;gap:0;text-align:center}
.cats a{
  display:block;
  font-size:var(--cat);
  line-height:1.18;
  letter-spacing:-.01em;   /* large type wants less tracking, not more */
  font-weight:var(--heavy);
  padding:6px 0;
  transition:color .45s var(--ease);
}
@media (hover:hover) and (pointer:fine){
  .cats-inner:hover a{color:var(--fg-dim)}
  .cats-inner:hover a:hover{color:var(--fg)}
}

/* ============================================================================
   THE FRONT PAGE — a pile

   Every photograph, scattered over one screen, fading in on top of one
   another. Three decisions worth knowing:

   Tiles are positioned by their CENTRE, not their top-left corner. Most of
   these photographs arrive without dimensions in the JSON, so the height
   of a tile isn't known until the image lands. Centre-positioning doesn't
   care — a portrait and a landscape both stay where they were put, and
   nothing jumps when the real proportions arrive.

   The scatter is deliberately biased towards the middle. Two random
   numbers averaged, rather than one, which clusters tiles centrally and
   leaves the corners sparse. Uniformly random positions look evenly
   sprinkled, which is the opposite of a pile.

   Stacking order is just DOM order — later arrivals paint on top. No
   z-index bookkeeping, and the pile builds in the order things load.
   ============================================================================ */
.pile{position:relative;min-height:100svh;overflow:hidden}
.pile-field{
  position:absolute;
  top:var(--head-h);
  right:var(--edge-r);
  bottom:calc(12vh + var(--sa-b));
  left:var(--edge-l);
}
.chip{
  position:absolute;
  left:calc(var(--x) * 100%);
  top:calc(var(--y) * 100%);
  width:calc(var(--pile-w) * var(--f,1));
  border:0;padding:0;background:none;
  cursor:zoom-in;
  line-height:0;
  opacity:0;
  transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.94);
  transition:opacity .75s var(--ease), transform .75s var(--ease);
  will-change:opacity,transform;
}
.chip.in{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}
.chip img{display:block;width:100%;height:auto}
/* The lift lives on the image rather than the button so it doesn't fight
   the translate/rotate the chip is already carrying. */
@media (hover:hover) and (pointer:fine){
  .chip img{transition:transform .3s var(--ease)}
  .chip:hover{z-index:60}
  .chip:hover img{transform:scale(1.04)}
}
.pile-tail{
  position:absolute;left:0;right:0;
  bottom:calc(5vh + var(--sa-b));
  text-align:center;z-index:70;
  font-size:var(--nav);
}

/* ============================================================================
   THE FLOW — one photograph at a time

   Every frame gets a full screen to itself and the scroll comes to rest on
   each. `mandatory` guarantees you always land on a photograph rather than
   between two; `scroll-snap-stop:always` is the half that matters, because
   without it a hard flick skips three or four at once.

   The easing is the browser's own. It already reads as a settle rather
   than a jump, and hand-rolling it feels worse.
   ============================================================================ */
html{scroll-snap-type:y mandatory}

.flow{padding:0}

.plate{
  min-height:100svh;
  display:grid;place-items:center;
  /* The header is fixed over the top of this, so the padding is what
     keeps a centred photograph clear of it rather than tucked underneath. */
  padding:var(--head-h) var(--edge-r) 7vh var(--edge-l);
  scroll-snap-align:center;
  scroll-snap-stop:always;
}

/* width:100% is load-bearing. A <button> is shrink-to-fit, so without it
   the frame's percentage width resolves against a button whose width
   depends on the frame — circular, resolved at zero, and the photograph
   loads but is invisible. */
.open{display:block;width:100%;cursor:zoom-in}

.frame{
  position:relative;overflow:hidden;background:var(--sunk);
  /* Capped by width and by height at once; whichever binds first wins, so
     any shape fills as much of the screen as it can without cropping. */
  width:min(var(--imgw), calc(var(--imgh) * var(--arn,1.5)));
  max-width:100%;
  margin-inline:auto;
  aspect-ratio:var(--ar,3/2);
}
/* Without dimensions in the JSON we can't reserve the true shape, but we
   must reserve something — a frame with no size is a blank page until the
   file lands. adoptRatio() corrects this the moment the image decodes. */
.frame.auto{aspect-ratio:3/2}
.frame.auto img{object-fit:contain}

.frame img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  /* The whole entrance: each photograph fades up once decoded. A failed
     image stays at 0, so you see an empty frame rather than its alt text. */
  opacity:0;transition:opacity 1.2s var(--ease);
}
.frame img.ready{opacity:1}

/* Also a snap target. Under `mandatory` the scroller must come to rest on
   one, so without this the last photograph becomes a floor you can't
   scroll past and the link is unreachable. */
.flow-end{
  min-height:60svh;display:grid;place-items:center;
  padding:0 var(--edge-r) 0 var(--edge-l);
  scroll-snap-align:center;
}

/* ============================================================================
   INFORMATION + THE RENOVATION NOTICE
   ============================================================================ */
.info{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.info-inner{max-width:34rem}
.info-inner p{padding:2px 0}

.reno{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.reno-inner{display:grid;justify-items:center;gap:22px;text-align:center;max-width:30rem}
.reno-toggle{padding:10px 14px;margin:-10px -14px}
.reno-info{display:grid;gap:2px;opacity:0;transform:translateY(-4px);
  transition:opacity .45s var(--ease),transform .45s var(--ease)}
.reno-info.open{opacity:1;transform:none}

/* ============================================================================
   LIGHTBOX
   ============================================================================ */
.lb{--lb-pad-x:calc(var(--edge-l) + var(--edge-r));
    --lb-pad-y:calc(112px + var(--sa-t) + var(--sa-b));
    position:fixed;inset:0;z-index:200;background:var(--bg);display:none;opacity:0;
    transition:opacity .45s var(--ease);overscroll-behavior:contain;touch-action:none}
.lb.open{display:block}
.lb.shown{opacity:1}
.lb-body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(56px + var(--sa-t)) var(--edge-r) calc(56px + var(--sa-b)) var(--edge-l)}
/* max-height:100% cannot be used here: in a flex container whose track is
   auto-sized, the percentage resolves against a track sized by the image —
   circular, so browsers drop it and a tall portrait runs off the bottom. */
.lb-body img{
  display:block;width:auto;height:auto;
  max-width:calc(100vw - var(--lb-pad-x));
  max-height:calc(100svh - var(--lb-pad-y));
  object-fit:contain;
  opacity:0;transition:opacity .45s var(--ease);
}
.lb-body img.ready{opacity:1}
.lb-bar{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  display:flex;justify-content:flex-end;align-items:baseline;
  padding:0 var(--edge-r) 0 var(--edge-l);gap:20px;pointer-events:none}
.lb-bar > *{pointer-events:auto}
.lb-nav{display:flex;gap:8px;align-items:baseline}
.lb-bar button{padding:12px 6px;margin:-12px -6px;display:inline-block}

/* ============================================================================
   NARROW SCREENS
   The rhythm needs width to read as composition. Below 900px it collapses
   to one full-width column — offsets and overlaps at phone width look
   like a mistake rather than a decision.
   ============================================================================ */
@media (max-width:900px){
  :root{--imgh:clamp(180px, 66svh, 760px);--imgw:94vw}
  .lb{--lb-pad-y:calc(126px + var(--sa-t) + var(--sa-b))}
  .lb-body{padding:calc(48px + var(--sa-t)) var(--edge-r) calc(78px + var(--sa-b)) var(--edge-l)}
  .lb-bar{top:auto;bottom:0;transform:none;
    padding:16px var(--edge-r) calc(14px + var(--sa-b)) var(--edge-l);
    background:linear-gradient(to top,var(--bg) 58%,transparent)}
}
@media (max-width:700px){
  :root{--edge:16px;--imgh:clamp(160px, 60svh, 620px);--head-h:clamp(88px,11vh,112px);
        --pile-w:clamp(86px,26vmin,150px)}
}

/* ============================================================================
   REDUCED MOTION — all of this is decoration.
   ============================================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
  .frame img{opacity:1}
  #view.out{opacity:1}
  html.theming,html.theming *,html.theming *::before,html.theming *::after{
    transition-duration:.001ms!important;
  }
  /* Mandatory snap moves the page without being asked, which is exactly
     what this preference is about. Proximity still helps you land on a
     photograph but never overrides a deliberate scroll. */
  html{scroll-snap-type:y proximity}
}
.boot{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
</style>
<noscript><style>#view,.head .to,.corner{display:none}</style></noscript>
</head>

<body>
<a class="skip" href="#/">Skip to content</a>

<header class="head">
  <a class="name h" href="#/">DEVIN FEILEN</a>
  <span class="to">
    <a class="h morph" href="#/photography" data-nav="photography" data-t="PHOTOGRAPHY" aria-label="Photography"><span>PHOTOGRAPHY</span></a><span aria-hidden="true">,</span>
    <a class="h morph" href="#/information"  data-nav="information" data-t="INFORMATION" aria-label="Information"><span>INFORMATION</span></a>
  </span>
</header>

<div class="corner"><button class="h" id="theme">Dark mode</button></div>

<main id="view"><div class="boot"><p class="dim">Loading</p></div></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-body"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span class="lb-nav">
      <button class="h" id="lb-prev">Prev</button>
      <button class="h" id="lb-next">Next</button>
      <button class="h" id="lb-close">Close</button>
    </span>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================================
   CONFIGURATION
   ============================================================================ */
const CDN = 'https://devinfeilen.b-cdn.net';

// Bunny Optimizer resizes via ?width=. If it's off on your pull zone the
// parameter is ignored and you get originals — safe either way, but turn
// it on: it is most of the weight saving available here.
const USE_OPTIMIZER = true;
const WIDTHS = [320, 640, 1000, 1500, 2200];   /* 320 exists for the front-page pile */

/* THE CATEGORIES.

   `title` is the only word anyone sees. `slug` is the URL. `sources` is
   which JSON files feed the category — one each now that the Bunny
   folders match the categories, so folder / JSON file / source name are
   all the same word.

   `sources` stays an array because it costs nothing and it's the escape
   hatch: if you later want, say, Racing to pull from two folders, add a
   second name rather than moving files around on the CDN.

   A category whose file is missing or empty simply doesn't appear — no
   error, nothing broken — so you can add these one at a time. */
/* `sources` must match your JSON filenames exactly, capitals included —
   these are `AB.json`, `Bikes.json` and so on, sitting next to
   index.html. `slug` is the URL and is kept lowercase because URLs
   should be. `title` is the only thing a visitor ever reads. */
const CATEGORIES = [
  { slug:'bikes',    title:'Bikes',    sources:['Bikes'] },
  { slug:'running',  title:'Running',  sources:['Running'] },
  { slug:'cars',     title:'Cars',     sources:['Cars'] },
  { slug:'singles',  title:'Singles',  sources:['Singles'] },
  { slug:'couples',  title:'Couples',  sources:['Couples'] },
  { slug:'ab',       title:'A&B',      sources:['AB'] }
];

/* How many photographs the front page shows, drawn at random from every
   category. Picked once when the page loads and held for the visit, so
   moving between Photography and back doesn't reshuffle underneath you.
   A reload gives a new five.

   This is the only randomness on the site — the sequence inside each
   category is exactly the order of its JSON file, unshuffled. */
/* THE FRONT-PAGE PILE.

   Every photograph in every file, scattered over one screen and fading in
   on top of one another. The numbers below are the whole safety story:

   PILE_MOBILE_MAX  a phone gets a subset. 90 tiles on a 390px screen is
                    neither legible nor survivable.
   PILE_CONCURRENCY how many are in flight at once. Bunny speaks HTTP/2, so
                    without a limit the browser would open all ninety
                    simultaneously and every one would arrive slowly.
   PILE_RAW_CAP     the emergency brake. See pileGuard(). */
const PILE_MOBILE_MAX  = 30;
const PILE_STAGGER     = 45;    /* ms between reveals */
const PILE_CONCURRENCY = 8;
const PILE_RAW_CAP     = 12;

/* Safety cap per file, not a curation tool — with the site down to ~53
   photographs every one should appear. This only stops a stale or
   accidentally restored file dumping a hundred frames into a category. */
const MAX_PER_FILE = 40;


const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches:false });
const REDUCED = mq('(prefers-reduced-motion: reduce)').matches;

/* ============================================================================
   UTILITIES
   ============================================================================ */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* replaceChildren() is Safari 14+. On an older iPhone it throws, the
   router dies, and nothing renders — indistinguishable from a blank site. */
const swapIn = (parent, el) => { parent.textContent = ''; parent.appendChild(el); };

const urlFor = (slug,f) => /^https?:\/\//i.test(f) ? f : `${CDN}/${slug}/${f}`;
const sized  = (u,w) => USE_OPTIMIZER ? u + (u.includes('?')?'&':'?') + 'width=' + w : u;
const srcset = u => USE_OPTIMIZER ? WIDTHS.map(w=>`${sized(u,w)} ${w}w`).join(', ') : '';

/* ============================================================================
   STATE
   ============================================================================ */
const DATA = new Map();   // slug -> { ...category, photos }
let HOME = [];            // the front page's random handful
let RENOVATING = false;

/* Fisher–Yates over a copy. Doing it this way rather than sorting by
   Math.random() matters: a random comparator is not a valid sort, and it
   skews the result badly — some positions come up far more often than
   others. This is the only shuffle on the site: the front page and every
   category both go through it. */
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function adoptRatio(plate, frame, img, p) {
  if (p.ar) return;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  p.ar = `${w} / ${h}`; p.arn = w / h;
  frame.style.setProperty('--ar', p.ar);
  frame.style.setProperty('--arn', p.arn);
  frame.classList.remove('auto');
}

/* ============================================================================
   DECODED-MEMORY WINDOWING

   `loading="lazy"` says when an image is fetched but nothing about when
   it's released. Once decoded it stays decoded, and a 6192×4128 original
   is ~102 MB *each*. On iOS — so in every iOS browser, since they all run
   WebKit — the renderer stops decoding long before a dozen of those and
   images simply never appear.

   So a src is attached only near the viewport and removed once well past.
   The frame keeps its reserved box and placeholder, so a detached frame
   looks exactly like one that hasn't loaded yet.
   ============================================================================ */
const KEEP_NEAR = '120% 0px';
let windowIO = null;

function attachImage(img) {
  if (img.dataset.on === '1') return;
  img.dataset.on = '1';
  mount(img, img.dataset.url, { sizes: img.dataset.sizes, eager: img.dataset.eager === '1' });
  const p = img.__photo, frame = img.__frame, plate = img.__plate;
  if (p && frame && !p.ar) {
    const learn = () => adoptRatio(plate, frame, img, p);
    if (img.complete && img.naturalWidth) learn();
    else img.addEventListener('load', learn, { once:true });
  }
}
function detachImage(img) {
  if (img.dataset.on !== '1') return;
  if (img.dataset.eager === '1') return;
  img.dataset.on = '0';
  img.classList.remove('ready');
  img.removeAttribute('srcset');
  img.removeAttribute('src');
}
function initWindowing(scope) {
  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  const plates = $$('.plate', scope);
  if (!plates.length) return;
  if (!('IntersectionObserver' in window)) {
    $$('.frame img', scope).forEach(attachImage);
    return;
  }
  windowIO = new IntersectionObserver(ents => {
    ents.forEach(e => {
      const img = $('.frame img', e.target);
      if (!img) return;
      if (e.isIntersecting) attachImage(img); else detachImage(img);
    });
  }, { rootMargin: KEEP_NEAR });
  plates.forEach(p => windowIO.observe(p));
}

/* ============================================================================
   IS THE CDN ANSWERING?

   The photo lists live on GitHub Pages, the photographs on Bunny, so the
   two fail independently — the site can load perfectly and show nothing
   but empty frames.

   Two checks: a quick sample up front for a pull zone that's entirely
   dead, and — because a sample is wrong when some files are still cached
   at the visitor's edge and the rest are gone — the real photographs
   report back too. Only definitive errors trigger it; a timeout counts as
   alive, because falsely announcing renovations on a slow phone is far
   worse than briefly showing empty frames.
   ============================================================================ */
const CDN_PROBES = 3, CDN_TIMEOUT = 9000, FAIL_SAMPLE = 3;
let imgTried = 0, imgFailed = 0;

function noteImage(ok) {
  imgTried++;
  if (!ok) imgFailed++;
  if (RENOVATING) return;
  if (imgTried >= FAIL_SAMPLE && imgFailed === imgTried) {
    declareRenovation('every photograph attempted so far has failed to load');
  }
}
function declareRenovation(why) {
  if (RENOVATING) return;
  RENOVATING = true;
  console.warn('Showing the renovation notice — ' + why + '.');
  document.documentElement.classList.add('renovating');
  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  if (parseRoute().name !== 'information') swapIn(view, renderRenovation());
  current = '';
}
function cdnAnswering(urls) {
  if (!urls.length) return Promise.resolve(false);
  return new Promise(resolve => {
    let errors = 0, settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); } };
    const timer = setTimeout(() => done(true), CDN_TIMEOUT);
    urls.forEach(u => {
      const probe = new Image();
      probe.onload  = () => { clearTimeout(timer); done(true); };
      probe.onerror = () => { if (++errors === urls.length) { clearTimeout(timer); done(false); } };
      probe.src = USE_OPTIMIZER ? sized(u, 640) : u;
    });
  });
}
function probeUrls(list) {
  const out = [], step = Math.max(1, Math.floor(list.length / CDN_PROBES));
  for (let i = 0; i < list.length && out.length < CDN_PROBES; i += step) out.push(list[i].url);
  return out;
}

function mount(img, url, { sizes, eager, base } = {}) {
  img.decoding = 'async';
  img.loading = eager ? 'eager' : 'lazy';
  if (eager) img.fetchPriority = 'high';
  const ss = srcset(url);
  if (ss) { img.srcset = ss; img.sizes = sizes || '60vw'; }
  img.src = USE_OPTIMIZER ? sized(url, base || 1500) : url;
  const ok  = () => { img.classList.add('ready'); noteImage(true); };
  const bad = () => { img.classList.remove('ready'); noteImage(false); };
  if (img.complete && img.naturalWidth) ok();
  else { img.addEventListener('load',  ok,  {once:true});
         img.addEventListener('error', bad, {once:true}); }
}

/* ============================================================================
   DATA — accepts the object schema or plain arrays of filenames/URLs
   ============================================================================ */
async function loadFile(slug) {
  try {
    const res = await fetch(`${slug}.json`, { cache:'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const raw = await res.json();
    const body = Array.isArray(raw) ? { photos: raw } : raw;
    const list = body.photos || body.images || [];
    return list.slice(0, MAX_PER_FILE).map(item => {
      const o = typeof item === 'string' ? { file:item } : item;
      const w = Number(o.w)||null, h = Number(o.h)||null;
      return {
        url: urlFor(slug, o.file || o.src || ''),
        ar:  (w&&h) ? `${w} / ${h}` : null,
        arn: (w&&h) ? (w/h) : null
        /* `caption` and `place` in the JSON are read by nothing. */
      };
    }).filter(p => p.url);
  } catch (e) {
    console.warn(`[${slug}] ${slug}.json did not load`, e);
    return [];
  }
}

/* ============================================================================
   VIEWS
   ============================================================================ */
const view = $('#view');

function renderCategories() {
  const live = CATEGORIES.filter(c => DATA.has(c.slug));
  const el = document.createElement('div');
  el.className = 'cats';
  el.innerHTML = `<div class="cats-inner">${
    live.map(c => `<a class="h morph" href="#/c/${c.slug}" data-slug="${c.slug}" data-t="${esc(c.title)}" aria-label="${esc(c.title)}"><span>${esc(c.title)}</span></a>`).join('')
  }</div>`;
  return el;
}

/* One flow builder for every category. `list` is the working set the
   lightbox steps through, so Prev/Next stays inside the category you're
   looking at rather than wandering into another one. */
/* The flow itself, shared by a category and by the front page. `list` is
   also the set the lightbox steps through, so Prev/Next never wanders
   outside what you were looking at. */
function buildFlow(list) {
  const flow = document.createElement('div');
  flow.className = 'flow';

  list.forEach((p, n) => {
    const fig = document.createElement('figure');
    fig.className = 'plate';

    const btn = document.createElement('button');
    btn.className = 'open';
    btn.type = 'button';
    btn.setAttribute('aria-label', `Open photograph ${pad(n+1)}`);

    const frame = document.createElement('div');
    frame.className = 'frame' + (p.ar ? '' : ' auto');
    if (p.ar)  frame.style.setProperty('--ar', p.ar);
    if (p.arn) frame.style.setProperty('--arn', p.arn);

    const img = document.createElement('img');
    img.alt = `Photograph ${pad(n+1)}`;   // never shown; a screen reader
    frame.appendChild(img);               // still has to announce something
    btn.appendChild(frame);
    fig.appendChild(btn);
    flow.appendChild(fig);

    img.dataset.url   = p.url;
    img.dataset.sizes = '(max-width:900px) 94vw, 78vw';
    img.dataset.eager = n === 0 ? '1' : '0';
    img.dataset.on    = '0';
    img.__photo = p; img.__frame = frame; img.__plate = fig;
    if (n === 0) attachImage(img);

    btn.addEventListener('click', () => openLB(list, n));
  });

  return flow;
}

function tail(href, label) {
  const end = document.createElement('div');
  end.className = 'flow-end';
  end.innerHTML = `<a class="h" href="${href}">${esc(label)} &rarr;</a>`;
  return end;
}

/* ============================================================================
   THE FRONT PAGE

   Every photograph, piled onto one screen. The interesting problem here is
   not the scatter, it's the weight: ninety images all visible at once is
   the exact situation the rest of this file spends its effort avoiding.
   Down the flow, only the photographs near the viewport are ever attached;
   here they must all be attached at the same time.

   Three things keep it survivable.

   1. Tiles are small, and they ASK for small. A tile is a couple of
      hundred pixels wide, so `sizes` is set to its measured width and the
      browser draws 320 from the ladder instead of 1500. That's the
      difference between roughly 24 MB of decoded image and 8 GB.

   2. Only PILE_CONCURRENCY are in flight. Bunny speaks HTTP/2, which
      multiplexes freely — without a limit the browser opens all ninety at
      once and every one of them crawls. Eight at a time also produces the
      cascade you actually want to look at.

   3. pileGuard() — see below.
   ============================================================================ */

/* THE EMERGENCY BRAKE.

   Everything above assumes ?width= is honoured. If Bunny's Optimizer is
   off, it isn't: every request returns the 6192 x 4128 original, and
   ninety of those is about 200 MB of download and 8 GB of decoded bitmap.
   Safari on iOS doesn't degrade there, it dies.

   So the first image to arrive is measured. If it came back far larger
   than was asked for, the CDN is ignoring the parameter and the pile cuts
   itself down to PILE_RAW_CAP. The page stays up, and the console says
   plainly what happened and how to fix it.

   Turn the Optimizer on (or upload resized photographs) and this never
   fires — all ninety come back on their own. */
function pileGuard(img, want) {
  if (!img.naturalWidth) return false;
  const ignored = img.naturalWidth > Math.max(want * 2, 1200);
  if (ignored) {
    console.warn(
      `[pile] Asked the CDN for ~${want}px and got ${img.naturalWidth}px. ` +
      `Bunny's Optimizer is off, so every photograph is a full-size original. ` +
      `Showing ${PILE_RAW_CAP} instead of the full set to keep the page alive. ` +
      `Turn on Optimizer > Dynamic Image API, or upload resized files, and the ` +
      `rest will appear on their own.`);
  }
  return ignored;
}

function renderHome() {
  const el = document.createElement('div');
  el.className = 'pile';

  const field = document.createElement('div');
  field.className = 'pile-field';
  el.appendChild(field);

  /* A phone gets a subset. This is not a rendering limit — it's that
     thirty tiles is already a dense pile on a 390px screen, and ninety is
     neither legible nor affordable. */
  const coarse = mq('(pointer: coarse)').matches || window.innerWidth < 700;
  const list = coarse ? HOME.slice(0, PILE_MOBILE_MAX) : HOME.slice();

  /* Two randoms averaged rather than one. A single uniform random spreads
     tiles evenly to the edges, which reads as a sprinkle; averaging two
     pulls them towards the middle, which reads as a pile.

     The horizontal spread then widens with the shape of the screen. The
     same distribution on both axes gives a tidy central clump on a wide
     monitor with a third of the width left empty either side — correct on
     a phone, wrong on a laptop. The vertical spread stays tight, because
     that's the axis the pile actually reads along. */
  const shape   = Math.min(2, Math.max(1, window.innerWidth / Math.max(1, window.innerHeight)));
  const spreadX = Math.min(0.94, 0.82 * shape);
  const spreadY = 0.82;
  const middling = sp => (1 - sp) / 2 + ((Math.random() + Math.random()) / 2) * sp;
  const between  = (a,b) => a + Math.random() * (b - a);

  const chips = list.map((p, n) => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.type = 'button';
    btn.setAttribute('aria-label', `Open photograph ${pad(n+1)}`);
    btn.style.setProperty('--x', middling(spreadX).toFixed(4));
    btn.style.setProperty('--y', middling(spreadY).toFixed(4));
    btn.style.setProperty('--r', between(-9, 9).toFixed(2) + 'deg');
    btn.style.setProperty('--f', between(0.72, 1.34).toFixed(3));

    const img = document.createElement('img');
    img.alt = `Photograph ${pad(n+1)}`;   // never shown; a screen reader
    /* Which photograph this tile is, recorded before it loads. The flow
       does the same. It costs nothing and means a tile is identifiable
       while it's still queued behind the concurrency limit. */
    img.dataset.url = p.url;
    btn.appendChild(img);                 // still has to announce something
    field.appendChild(btn);
    btn.addEventListener('click', () => openLB(list, n));
    return { btn, img, p };
  });

  const tailEl = document.createElement('div');
  tailEl.className = 'pile-tail';
  tailEl.innerHTML = `<a class="h" href="#/photography">Photography &rarr;</a>`;
  el.appendChild(tailEl);

  /* The loader runs once the pile is in the document, because each tile's
     width has to be measured before it can be asked for at that size. */
  requestAnimationFrame(() => runPile(chips));
  return el;
}

function runPile(chips) {
  let started = 0, cap = chips.length, checked = false;
  const t0 = Date.now();

  const reveal = (c, i) => {
    const due = REDUCED ? 0 : Math.max(0, i * PILE_STAGGER - (Date.now() - t0));
    setTimeout(() => c.btn.classList.add('in'), due);
  };

  const next = () => {
    if (started >= Math.min(cap, chips.length)) return;
    const i = started++, c = chips[i];
    const want = Math.round(c.btn.getBoundingClientRect().width) || 200;

    c.img.addEventListener('load', () => {
      if (!checked) {
        checked = true;
        if (pileGuard(c.img, want)) {
          cap = Math.min(cap, PILE_RAW_CAP);
          chips.slice(cap).forEach(x => x.btn.remove());
        }
      }
      reveal(c, i);
      next();
    }, { once:true });

    /* A photograph that won't load is removed rather than revealed as a
       broken frame. mount() has already told the renovation check about
       it, so if they ALL fail the site still falls back properly. */
    c.img.addEventListener('error', () => { c.btn.remove(); next(); }, { once:true });

    mount(c.img, c.p.url, { sizes: want + 'px', base: 640 });
  };

  for (let k = 0; k < PILE_CONCURRENCY; k++) next();
}

function renderFlow(cat) {
  const live = CATEGORIES.filter(c => DATA.has(c.slug));
  const i = live.findIndex(c => c.slug === cat.slug);
  const next = live[(i + 1) % live.length];

  const el = document.createElement('div');
  el.appendChild(buildFlow(cat.photos));
  el.appendChild(next && next.slug !== cat.slug
    ? tail(`#/c/${next.slug}`, next.title)
    : tail('#/photography', 'Photography'));
  return el;
}

/* Written once and used by both the Information view and the fallback
   screen, so the two can never drift apart. */
const INFORMATION = `
    <p>Devin Feilen is a photographer based in Portland, Oregon.</p>
    <p><a class="h" href="mailto:dfeeilen@gmail.com">dfeeilen@gmail.com</a></p>
    <p><a class="h" href="https://instagram.com/devinfeilen" target="_blank" rel="noopener">instagram</a></p>
    <p><a class="h" href="https://buymeacoffee.com/devinfeilen" target="_blank" rel="noopener">buy me a coffee</a></p>`;

function renderInformation() {
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner">${INFORMATION}</div>`;
  return el;
}

function renderRenovation() {
  const el = document.createElement('div');
  el.className = 'reno';
  el.innerHTML = `
    <div class="reno-inner">
      <p>Under renovations</p>
      <button class="h reno-toggle" id="reno-contact" aria-expanded="false">Contact</button>
      <div class="reno-info" id="reno-info" hidden>${INFORMATION}</div>
    </div>`;
  const btn = $('#reno-contact', el), box = $('#reno-info', el);
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    if (open) { box.hidden = true; box.classList.remove('open'); }
    else { box.hidden = false; requestAnimationFrame(() => box.classList.add('open')); }

function renderMissing(msg) {
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner"><p>${esc(msg)}</p>
    <p><a class="h" href="#/photography">Photography</a></p></div>`;
  return el;
}

/* ============================================================================
   LIGHTBOX

   srcset + sizes is the right tool for an image filling a known slice of
   the page, but it cannot describe this one: `sizes` only expresses a
   WIDTH, and a contained image is usually limited by HEIGHT. A portrait on
   a wide desktop displays at ~30vw while sizes:100vw tells the browser to
   fetch as though it were full-bleed — so it always pulled the largest
   file on the ladder no matter how small the window.

   The ratio is known, so the displayed size is computed and one exact file
   requested, snapped to the ladder so the CDN cache still works.
   ============================================================================ */
const lb = $('#lb'), lbImg = $('#lb-img');
const DPR_CAP = 2;
let lbList = [], lbi = 0, lastFocus = null, lockedY = 0, loadedLBWidth = 0;

/* iOS Safari ignores overflow:hidden on the root — the page keeps
   scrolling behind the overlay and you lose your place. Pinning the body
   at a negative offset is the only thing that holds. */
function lockScroll() {
  lockedY = window.scrollY || 0;
  const b = document.body;
  b.style.position='fixed'; b.style.top=`-${lockedY}px`;
  b.style.left='0'; b.style.right='0'; b.style.width='100%';
}
function unlockScroll() {
  const b = document.body;
  b.style.position=b.style.top=b.style.left=b.style.right=b.style.width='';
  window.scrollTo(0, lockedY);
}
function lbAvailable() {
  const el = $('.lb-body');
  if (!el || !el.clientWidth) return { w: innerWidth, h: innerHeight };
  const cs = getComputedStyle(el);
  const w = el.clientWidth  - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
  const h = el.clientHeight - parseFloat(cs.paddingTop||0)  - parseFloat(cs.paddingBottom||0);
  return { w: w>0?w:innerWidth, h: h>0?h:innerHeight };
}
function lbTargetWidth(f) {
  const a = lbAvailable(), arn = f.arn || 1.5;
  const cssW = Math.min(a.w, a.h * arn);
  const need = Math.ceil(cssW * Math.min(window.devicePixelRatio || 1, DPR_CAP));
  return WIDTHS.find(w => w >= need) || WIDTHS[WIDTHS.length - 1];
}
function openLB(list, i) {
  if (!list || !list.length) return;
  lbList = list; lbi = i; lastFocus = document.activeElement;
  lockScroll();
  lb.classList.add('open');
  requestAnimationFrame(() => lb.classList.add('shown'));
  drawLB();
  $('#lb-close').focus();
}
function closeLB() {
  lb.classList.remove('shown');
  setTimeout(() => {
    lb.classList.remove('open');
    unlockScroll();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }, REDUCED ? 0 : 450);
}
function stepLB(d) { if (!lbList.length) return; lbi = (lbi + d + lbList.length) % lbList.length; drawLB(); }
function drawLB() {
  const f = lbList[lbi]; if (!f) return;
  lbImg.classList.remove('ready');
  lbImg.removeAttribute('srcset');
  lbImg.removeAttribute('sizes');
  lbImg.alt = `Photograph ${pad(lbi+1)}`;
  lbImg.decoding = 'async';
  lbImg.fetchPriority = 'high';
  loadedLBWidth = lbTargetWidth(f);
  lbImg.src = sized(f.url, loadedLBWidth);
  const show = () => lbImg.classList.add('ready');
  if (lbImg.complete && lbImg.naturalWidth) show();
  else { lbImg.addEventListener('load', show, {once:true});
         lbImg.addEventListener('error', show, {once:true}); }
}
$('#lb-close').addEventListener('click', closeLB);
$('#lb-prev').addEventListener('click', () => stepLB(-1));
$('#lb-next').addEventListener('click', () => stepLB(1));
lb.addEventListener('click', e => { if (e.target===lb || e.target.closest('.lb-body')) closeLB(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLB();
  if (e.key === 'ArrowLeft')  stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
  if (e.key === 'Tab') { e.preventDefault(); $('#lb-close').focus(); }
});
let tx=0, ty=0;
lb.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
lb.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>45) stepLB(dx>0?-1:1);
}, {passive:true});

let lbResizeTimer = null;
addEventListener('resize', () => {
  if (!lb.classList.contains('open')) return;
  clearTimeout(lbResizeTimer);
  lbResizeTimer = setTimeout(() => {
    const f = lbList[lbi]; if (!f) return;
    const need = lbTargetWidth(f);
    if (need > loadedLBWidth) { loadedLBWidth = need; lbImg.src = sized(f.url, need); }
  }, 250);
}, { passive:true });

/* ============================================================================
   ROUTER
     #/               the category list  (same as #/photography)
     #/photography    the category list
     #/c/<slug>       one category's flow
     #/information    contact
   ============================================================================ */
function parseRoute() {
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!parts.length)              return { name:'home' };
  if (parts[0] === 'photography') return { name:'photography' };
  if (parts[0] === 'information') return { name:'information' };
  if (parts[0] === 'c')           return { name:'category', slug: parts[1] };
  // #/w/racing and friends were real URLs once; send them somewhere real.
  if (parts[0] === 'w')           return { name:'category', slug: parts[1] };
  return { name:'missing' };
}

let current = '';
async function route() {
  const r = parseRoute();
  const key = JSON.stringify(r);
  if (key === current) return;
  current = key;

  // PHOTOGRAPHY stays lit while you're inside a category.
  const navKey = r.name === 'category' ? 'photography' : r.name;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));

  view.classList.add('out');
  await wait(REDUCED ? 0 : 340);

  let el;
  if (RENOVATING && r.name !== 'information') {
    el = renderRenovation();
  } else if (r.name === 'information') {
    el = renderInformation();
  } else if (r.name === 'home') {
    el = renderHome();
  } else if (r.name === 'photography') {
    el = renderCategories();
  } else if (r.name === 'category') {
    const cat = DATA.get(r.slug);
    el = cat ? renderFlow(cat) : renderMissing('No such category.');
  } else {
    el = renderMissing('That page does not exist.');
  }

  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  swapIn(view, el);
  scrollTo({ top:0, behavior:'auto' });
  const hasFlow = !RENOVATING &&
    (r.name === 'home' || (r.name === 'category' && DATA.get(r.slug)));
  if (hasFlow) initWindowing(view);

  requestAnimationFrame(() => view.classList.remove('out'));
  const cat = r.name === 'category' && DATA.get(r.slug);
  document.title = cat ? `${cat.title} — Devin Feilen`
    : r.name === 'information' ? 'Information — Devin Feilen' : 'Devin Feilen';
}
addEventListener('hashchange', route);

/* ============================================================================
   THEME — warm light is the default, so the button offers Dark mode
   ============================================================================ */
const themeBtn = $('#theme');
const root = document.documentElement;
let themingTimer = null;

/* `animate` is only true for a deliberate toggle. On first load the theme
   is already correct, so there is nothing to fade and nothing should. */
function applyTheme(t, animate) {
  if (animate) {
    root.classList.add('theming');
    clearTimeout(themingTimer);
    themingTimer = setTimeout(() => root.classList.remove('theming'), 520);
  }
  if (t === 'dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  themeBtn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  const m = $('meta[name="theme-color"]');
  if (m) m.content = t === 'dark' ? '#0a0a0a' : '#EAE7E2';
}
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch(_) {}
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(theme, true);
  try { localStorage.setItem('theme', theme); } catch(_) {}
});

/* ============================================================================
   BOOT
   ============================================================================ */
(async function init() {
  const loaded = await Promise.all(CATEGORIES.map(async c => {
    const parts = await Promise.all(c.sources.map(loadFile));
    const photos = parts.flat();
    /* Shuffled here, once, rather than inside renderFlow() — for the same
       reason the front page is. If it happened at render time, every trip
       back into a category would reorder it under you, and the lightbox's
       Prev/Next would disagree with the page behind it. Shuffling at load
       means an order that holds for the whole visit and changes on reload.

       This also means order in the JSON file no longer decides anything.
       Which photographs are in the file is now the only editorial control
       left — so the argument for keeping each list short gets stronger,
       not weaker. */
    return photos.length ? { ...c, photos: shuffle(photos) } : null;
  }));
  loaded.filter(Boolean).forEach(c => DATA.set(c.slug, c));

  if (!DATA.size) { declareRenovation('no photo lists loaded'); return; }

  const everything = [].concat(...[...DATA.values()].map(c => c.photos));

  /* Every photograph, in one shuffled order. Shuffled once here rather
     than inside renderHome() so that returning to the front page shows the
     pile you left rather than rebuilding a different one. A reload
     scatters it afresh. */
  HOME = shuffle(everything);

  /* Render straight away. The probe must never sit between a visitor and
     the work — on a slow connection that would be seconds of nothing for
     a site that is perfectly fine. It runs alongside instead. */
  route();

  cdnAnswering(probeUrls(everything)).then(alive => {
    if (!alive) declareRenovation('no photograph on the CDN answered');
  });
})();
})();
