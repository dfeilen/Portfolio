<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the black run under the notch and home
     indicator; every fixed element then pads itself back out with
     env(safe-area-inset-*) below. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devin Feilen</title>
<meta name="description" content="Devin Feilen is a photographer based in Portland, Oregon.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:type" content="website">
<meta property="og:title" content="Devin Feilen">
<meta property="og:description" content="Photographer based in Portland, Oregon.">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://devinfeilen.b-cdn.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   ONE TYPE SIZE. ONE COLOUR. ONE RULE.

   The whole site is 13px / 15.6px / weight 400. There are no headings —
   not on the index, not on Information, not anywhere. That single
   constraint is most of the look: nothing on the page competes with a
   photograph for attention, so the photographs are the only thing with
   any visual weight.

   Resist adding a second size. It is the first thing that breaks this.
   ============================================================================ */
:root{
  --bg:#0a0a0a;
  --fg:#ffffff;
  --fg-dim:#8a8a8a;      /* 5.7:1 on --bg — secondary and disabled only */
  --sunk:#161616;

  --font:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --size:13px;
  --lh:15.6px;
  --track:0.01em;

  --edge:clamp(10px,2vw,28px);
  --gap:20px;             /* between frames, exactly as measured */
  --imgh:84svh;           /* frame height cap */
  --imgw:38vw;            /* frame width cap — leaves the side margins
                             that the centred bar lives in */
  --ease:cubic-bezier(.22,1,.36,1);
  --fade:340ms;

  /* Safe areas. Zero on everything that isn't a notched phone. */
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-t:env(safe-area-inset-top,0px);
  --edge-l:calc(var(--edge) + var(--sa-l));
  --edge-r:calc(var(--edge) + var(--sa-r));
}
[data-theme="light"]{
  --bg:#f0f0ed; --fg:#0a0a0a; --fg-dim:#686862; --sunk:#e2e2dd;  /* dim 4.9:1 */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,p,figure,figcaption,ul,li,h1,h2{margin:0;padding:0}
ul{list-style:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

html,body{background:var(--bg)}
body{
  color:var(--fg);
  font-family:var(--font);
  font-size:var(--size);
  line-height:var(--lh);
  letter-spacing:var(--track);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  transition:background .45s var(--ease),color .45s var(--ease);
  overflow-x:hidden;
  /* No grey flash on tap, and no 300ms wait for a double-tap that
     never comes — the page can't be pinch-zoomed into anyway. */
  -webkit-tap-highlight-color:transparent;
  text-size-adjust:100%;
}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}

a,button{touch-action:manipulation}
a{color:inherit;text-decoration:none}
.dim{color:var(--fg-dim)}
.tab{font-variant-numeric:tabular-nums}

/* Links dim on hover rather than underlining. At 13px an underline is
   noise; a change in weight would reflow. Opacity is the only move that
   costs nothing. */
a.h,button.h{transition:color .3s var(--ease)}
a.h:hover,button.h:hover,a.h:focus-visible,button.h:focus-visible{color:var(--fg-dim)}
a.h.on{color:var(--fg-dim);pointer-events:none}

.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--fg);color:var(--bg);padding:10px}
.skip:focus{left:0}

/* ============================================================================
   THE BAR
   Fixed at the vertical centre of the viewport, pinned to both edges.
   It sits in the empty margins either side of the picture — which is why
   the frame is capped at 38vw rather than filling the screen.
   ============================================================================ */
.bar{
  position:fixed;top:50%;left:0;right:0;
  transform:translateY(-50%);
  display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  padding:0 var(--edge-r) 0 var(--edge-l);
  z-index:50;pointer-events:none;
}
.bar > *{pointer-events:auto}
.bar-l{display:flex;gap:14px;min-width:0}
.bar-r{display:flex;gap:8px;white-space:nowrap;align-items:baseline}
.count{opacity:0;transition:opacity .3s var(--ease)}
.count.show{opacity:1}

/* Tap targets. The padding grows the hit area to ~38×38 without moving
   the text a pixel — the negative margin cancels it visually. 13px of
   bare text is a 16px-tall target, which is unusable with a thumb. */
.bar-r a,.bar-r button{
  padding:12px 6px;margin:-12px -6px;
  display:inline-block;line-height:var(--lh);
}

/* ============================================================================
   VIEWS
   ============================================================================ */
#view{opacity:1;transition:opacity var(--fade) var(--ease)}
#view.out{opacity:0}

/* ---- Index: three lines, same 13px as everything else ---- */
.index{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.index-inner{display:grid;gap:0;justify-items:center}
.index a{display:block;padding:3px 0;transition:color .3s var(--ease)}
@media (hover:hover) and (pointer:fine){
  .index-inner:hover a{color:var(--fg-dim)}
  .index-inner:hover a:hover{color:var(--fg)}
}
.index .n{margin-right:10px}

/* Hover preview — fills the frame slot behind the three names.
   All three images are created up front, so hovering only toggles a
   class. Never fires on touch; on touch the names simply stand alone. */
.pv{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:-1}
.pv img{
  max-width:var(--imgw);max-height:var(--imgh);
  width:auto;height:auto;object-fit:contain;
  position:absolute;opacity:0;transition:opacity .5s var(--ease);
}
.pv img.on{opacity:.28}
@media (hover:none),(pointer:coarse),(max-width:1200px){.pv{display:none}}

/* ---- Series: one picture per screen, centred ---- */
.plates{padding:8vh 0 12vh}
.plate{
  min-height:100svh;
  display:grid;place-items:center;
  padding:0 var(--edge-r) 0 var(--edge-l);
}
.frame{
  position:relative;overflow:hidden;background:var(--sunk);
  /* Capped two ways at once: never wider than 38vw, never taller than
     84svh. Whichever binds first wins, so a portrait and a landscape
     both end up occupying one screen without either being cropped. */
  width:min(var(--imgw),calc(var(--imgh) * var(--arn,1.5)));
  max-width:100%;
  aspect-ratio:var(--ar,3/2);
}
.frame.auto{aspect-ratio:auto}
.frame.auto img{position:static;height:auto}
.frame img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .7s var(--ease),transform .8s var(--ease);
}
.frame img.ready{opacity:1}
.open{display:block;cursor:zoom-in}
@media (hover:hover) and (pointer:fine){
  /* 2% inside a frame that never moves. Nothing reflows. */
  .open:hover .frame img.ready{transform:scale(1.02)}
}
.series-end{min-height:60svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}

/* ---- Information: five lines, vertically centred ---- */
.info{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.info-inner{max-width:34rem}
.info-inner p + p{margin-top:0}

/* ---- Lightbox ---- */
.lb{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;opacity:0;
  transition:opacity .28s var(--ease);overscroll-behavior:contain;touch-action:none}
.lb.open{display:block}
.lb.shown{opacity:1}
/* The chrome the picture has to clear, declared once so the CSS below
   and the JS that sizes the download can never drift apart. */
.lb{--lb-pad-x:calc(var(--edge-l) + var(--edge-r));
    --lb-pad-y:calc(112px + var(--sa-t) + var(--sa-b))}   /* 56 top + 56 bottom */

.lb-body{position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:calc(56px + var(--sa-t)) var(--edge-r) calc(56px + var(--sa-b)) var(--edge-l)}

/* max-height:100% cannot be used here. In a grid or flex container whose
   row is auto-sized, the percentage resolves against a track that is
   itself sized by the image — circular, so browsers drop it and a tall
   portrait runs straight off the bottom of the screen. Measuring
   against the viewport instead is unambiguous in every layout mode. */
.lb-body img{
  display:block;width:auto;height:auto;
  max-width:calc(100vw - var(--lb-pad-x));
  max-height:calc(100svh - var(--lb-pad-y));
  object-fit:contain;
  opacity:0;transition:opacity .28s var(--ease);
}
.lb-body img.ready{opacity:1}
.lb-bar{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  display:flex;justify-content:space-between;align-items:baseline;
  padding:0 var(--edge-r) 0 var(--edge-l);gap:20px;pointer-events:none}
.lb-bar > *{pointer-events:auto}
.lb-nav{display:flex;gap:8px;align-items:baseline}
.lb-bar button{padding:12px 6px;margin:-12px -6px;display:inline-block}

/* ============================================================================
   NARROW SCREENS

   The centred bar depends on wide empty margins either side of the
   picture. Below 1200px there aren't any, so it relocates to the bottom
   rather than sitting on top of a photograph.
   ============================================================================ */
@media (max-width:1200px){
  :root{--imgw:100%;--imgh:72svh}
  .bar{
    top:auto;bottom:0;transform:none;
    padding:16px var(--edge-r) calc(14px + var(--sa-b)) var(--edge-l);
    background:linear-gradient(to top,var(--bg) 58%,transparent);
  }
  .lb-bar{
    top:auto;bottom:0;transform:none;
    padding:16px var(--edge-r) calc(14px + var(--sa-b)) var(--edge-l);
    background:linear-gradient(to top,var(--bg) 58%,transparent);
  }
  /* Bar is at the bottom now, so the picture needs more room below. */
  .lb{--lb-pad-y:calc(126px + var(--sa-t) + var(--sa-b))}   /* 48 top + 78 bottom */
  .lb-body{padding:calc(48px + var(--sa-t)) var(--edge-r) calc(78px + var(--sa-b)) var(--edge-l)}
}

/* ---- Phones ---- */
@media (max-width:700px){
  :root{--edge:16px;--imgh:64svh}

  /* Two rows: the counter above, navigation below. Three nav items fit
     one line at 13px on a 360px screen. */
  .bar{flex-direction:column;align-items:stretch;gap:6px}
  .bar-l{gap:10px}
  .bar-r{justify-content:space-between;gap:4px}

  /* Plates stop being full-screen slots. One-per-screen is a desktop
     luxury; on a phone it means a lot of scrolling past empty space. */
  .plate{min-height:auto;padding:0 var(--edge-r) 0 var(--edge-l)}
  .plates{
    display:flex;flex-direction:column;gap:11vh;
    padding:12vh 0 calc(30vh + var(--sa-b));
  }
  .index{padding-bottom:calc(22vh + var(--sa-b))}
  .index a{padding:9px 0}          /* 31px tap target on three short words */
  .info{padding:0 var(--edge-r) calc(24vh + var(--sa-b)) var(--edge-l)}
  .info-inner p{padding:5px 0}
  .series-end{min-height:auto;padding:2vh var(--edge-r) 0 var(--edge-l)}
}

/* ---- Landscape phones: very little height, so give it back ---- */
@media (max-width:900px) and (orientation:landscape) and (max-height:520px){
  :root{--imgh:78svh}
  .plates{gap:8vh;padding:8vh 0 calc(24vh + var(--sa-b))}
  .bar{flex-direction:row;align-items:baseline}
}

/* ============================================================================
   REDUCED MOTION
   ============================================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
  .frame img,.pv img{opacity:1}
  .pv img{opacity:0}
  .pv img.on{opacity:.28}
  #view.out{opacity:1}
}
.boot{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
</style>
<noscript><style>#view,.bar{display:none}</style></noscript>
</head>

<body>
<a class="skip" href="#/">Skip to content</a>

<div class="pv" id="pv" aria-hidden="true"></div>

<main id="view"><div class="boot"><p class="dim">Loading</p></div></main>

<div class="bar" id="bar">
  <div class="bar-l">
    <span class="count tab" id="count"></span>
  </div>
  <nav class="bar-r" aria-label="Primary">
    <a class="h" href="#/" data-nav="index">Devin Feilen</a>
    <a class="h" href="#/information" data-nav="information">Information</a>
    <button class="h" id="theme">Light mode</button>
  </nav>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-body"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span class="tab" id="lb-count"></span>
    <span class="lb-nav">
      <button class="h" id="lb-prev">Prev</button>
      <button class="h" id="lb-next">Next</button>
      <button class="h" id="lb-close">Close</button>
    </span>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================================
   CONFIGURATION
   ============================================================================ */
const CDN = 'https://devinfeilen.b-cdn.net';

// Bunny Optimizer resizes via ?width=. If it is off on your pull zone the
// parameter is ignored and you get originals — safe either way.
const USE_OPTIMIZER = true;
const WIDTHS = [640, 1000, 1500, 2200];

// Hard cap per group. Curation happens in the JSON; this only stops a
// stale file dumping eighty frames into one scroll.
const MAX_PER_SERIES = 14;

/* THREE GROUPS.
   `sources` lists which of your existing JSON files feed each group, so
   nothing on your side needs renaming. Move a source from one line to
   another and the site regroups. Later you can consolidate into three
   real files — bikes.json / life.json / work.json — and set a single
   source each. */
const SERIES = [
  { slug:'bikes', title:'Bikes',        sources:['bikes','racing'] },
  { slug:'life',  title:'Life',         sources:['life','walls','people'] },
  { slug:'work',  title:'Professional', sources:['ab'] }
];

const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches:false });
const REDUCED = mq('(prefers-reduced-motion: reduce)').matches;

/* ============================================================================
   UTILITIES
   ============================================================================ */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

const urlFor = (slug,f) => /^https?:\/\//i.test(f) ? f : `${CDN}/${slug}/${f}`;
const sized  = (u,w) => USE_OPTIMIZER ? u + (u.includes('?')?'&':'?') + 'width=' + w : u;
const srcset = u => USE_OPTIMIZER ? WIDTHS.map(w=>`${sized(u,w)} ${w}w`).join(', ') : '';

function mount(img, url, { sizes, eager } = {}) {
  img.decoding = 'async';
  img.loading = eager ? 'eager' : 'lazy';
  if (eager) img.fetchPriority = 'high';
  const ss = srcset(url);
  if (ss) { img.srcset = ss; img.sizes = sizes || '40vw'; }
  img.src = USE_OPTIMIZER ? sized(url, 1500) : url;
  const show = () => img.classList.add('ready');
  if (img.complete && img.naturalWidth) show();
  else { img.addEventListener('load', show, {once:true});
         img.addEventListener('error', show, {once:true}); }
}

/* ============================================================================
   DATA — reads the new object schema or your existing flat string arrays
   ============================================================================ */
const DATA = new Map();
let FLAT = [];

async function loadFile(slug) {
  try {
    const res = await fetch(`${slug}.json`, { cache:'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const raw = await res.json();
    const body = Array.isArray(raw) ? { photos: raw } : raw;
    const list = body.photos || body.images || [];
    return list.map(item => {
      const o = typeof item === 'string' ? { file:item } : item;
      const w = Number(o.w)||null, h = Number(o.h)||null;
      return {
        src: slug,
        url: urlFor(slug, o.file || o.src || ''),
        ar:  (w&&h) ? `${w} / ${h}` : null,
        arn: (w&&h) ? (w/h) : null
        /* `caption` and `place` in the JSON are read by nothing. The
           pictures are numbered and otherwise unannotated. Leaving the
           fields in your files is harmless — they are simply ignored. */
      };
    }).filter(p => p.url);
  } catch (e) {
    console.warn(`[${slug}] ${slug}.json did not load`, e);
    return [];
  }
}

async function loadSeries(def) {
  const parts = await Promise.all(def.sources.map(loadFile));
  const photos = parts.flat().slice(0, MAX_PER_SERIES);
  return photos.length ? { ...def, photos } : null;
}

/* ============================================================================
   VIEWS
   ============================================================================ */
const view = $('#view'), pv = $('#pv');

function renderIndex() {
  const list = SERIES.map(s => DATA.get(s.slug)).filter(Boolean);
  const el = document.createElement('div');
  el.className = 'index';
  el.innerHTML = `<div class="index-inner">${
    list.map((s,i)=>`<a class="h" href="#/w/${s.slug}" data-slug="${s.slug}"><span class="n tab dim">${pad(i+1)}</span>${esc(s.title)}</a>`).join('')
  }</div>`;

  // Hover preview: one <img> per group, built once, cross-faded by class.
  pv.innerHTML = '';
  const layers = new Map();
  list.forEach(s => {
    if (!s.photos[0]) return;
    const img = document.createElement('img');
    img.alt = '';
    pv.appendChild(img);
    layers.set(s.slug, img);
    mount(img, s.photos[0].url, { sizes:'40vw' });
  });
  const show = slug => layers.forEach((img,k)=>img.classList.toggle('on', k===slug));
  const clear = () => layers.forEach(img=>img.classList.remove('on'));
  $$('a[data-slug]', el).forEach(a => {
    a.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') show(a.dataset.slug); });
    a.addEventListener('focus', () => show(a.dataset.slug));
  });
  $('.index-inner', el).addEventListener('pointerleave', clear);

  setBar('');
  return el;
}

function renderSeries(slug) {
  const s = DATA.get(slug);
  if (!s) return renderMissing('No such series.');
  pv.innerHTML = '';

  const i = SERIES.findIndex(x => x.slug === slug);
  const next = SERIES[(i+1) % SERIES.length];

  const el = document.createElement('div');
  el.innerHTML = `<div class="plates" id="plates"></div>
    <div class="series-end"><a class="h" href="#/w/${next.slug}">${esc(next.title)} &rarr;</a></div>`;
  const plates = $('#plates', el);

  s.photos.forEach((p, n) => {
    const gi = FLAT.indexOf(p);

    const fig = document.createElement('figure');
    fig.className = 'plate';
    fig.dataset.n = n + 1;

    const btn = document.createElement('button');
    btn.className = 'open';
    btn.type = 'button';
    /* A screen reader still needs to know what the control does and
       which picture it opens. That is function, not caption. */
    btn.setAttribute('aria-label', `Open photograph ${pad(n+1)}`);

    const frame = document.createElement('div');
    frame.className = 'frame' + (p.ar ? '' : ' auto');
    if (p.ar)  frame.style.setProperty('--ar', p.ar);
    if (p.arn) frame.style.setProperty('--arn', p.arn);

    const img = document.createElement('img');
    img.alt = `Photograph ${pad(n+1)}`;

    frame.appendChild(img);
    btn.appendChild(frame);
    fig.appendChild(btn);
    plates.appendChild(fig);

    mount(img, p.url, { sizes:'(max-width:1200px) 92vw, 38vw', eager: n===0 });
    btn.addEventListener('click', () => openLB(gi < 0 ? 0 : gi));
  });

  setBar(`01/${pad(s.photos.length)}`);
  return el;
}

function renderInformation() {
  pv.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner">
    <p>Devin Feilen is a photographer based in Portland, Oregon.</p>
    <p><a class="h" href="mailto:dfeeilen@gmail.com">dfeeilen@gmail.com</a></p>
    <p><a class="h" href="https://instagram.com/devinfeilen" target="_blank" rel="noopener">instagram</a></p>
    <p><a class="h" href="https://buymeacoffee.com/devinfeilen" target="_blank" rel="noopener">buy me a coffee</a></p>
  </div>`;
  setBar('');
  return el;
}

function renderMissing(msg) {
  pv.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner"><p>${esc(msg)}</p><p><a class="h" href="#/">Index</a></p></div>`;
  setBar('');
  return el;
}

/* ============================================================================
   THE COUNTER — reports which photograph is at the vertical centre, and
   nothing else. No title, no place, no year. Reports only; it never
   moves anything.
   ============================================================================ */
const countEl = $('#count');
let countIO = null;

function setBar(count) {
  countEl.textContent = count || '';
  countEl.classList.toggle('show', !!count);
}

function initCounter(scope, total) {
  if (countIO) { countIO.disconnect(); countIO = null; }
  const plates = $$('.plate', scope);
  if (!plates.length || !('IntersectionObserver' in window)) return;
  countIO = new IntersectionObserver(ents => {
    ents.forEach(e => {
      if (!e.isIntersecting) return;
      setBar(`${pad(e.target.dataset.n)}/${pad(total)}`);
    });
  }, { rootMargin:'-45% 0px -45% 0px' });
  plates.forEach(p => countIO.observe(p));
}

/* ============================================================================
   LIGHTBOX
   ============================================================================ */
const lb = $('#lb'), lbImg = $('#lb-img');
let lbi = 0, lastFocus = null, lockedY = 0;

/* iOS Safari ignores overflow:hidden on the root — the page keeps
   scrolling behind the overlay and you lose your place. Pinning the
   body at a negative offset is the only thing that actually holds,
   and the offset is what lets us restore the exact scroll position. */
function lockScroll() {
  lockedY = window.scrollY || 0;
  const b = document.body;
  b.style.position = 'fixed';
  b.style.top = `-${lockedY}px`;
  b.style.left = '0';
  b.style.right = '0';
  b.style.width = '100%';
}
function unlockScroll() {
  const b = document.body;
  b.style.position = b.style.top = b.style.left = b.style.right = b.style.width = '';
  window.scrollTo(0, lockedY);
}

function openLB(i) {
  if (!FLAT.length) return;
  lbi = i; lastFocus = document.activeElement;
  lockScroll();
  lb.classList.add('open');
  requestAnimationFrame(() => lb.classList.add('shown'));
  drawLB();
  $('#lb-close').focus();
}
function closeLB() {
  lb.classList.remove('shown');
  setTimeout(() => {
    lb.classList.remove('open');
    unlockScroll();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }, REDUCED ? 0 : 280);
}
function stepLB(d) { lbi = (lbi + d + FLAT.length) % FLAT.length; drawLB(); }

/* ---------------------------------------------------------------------------
   Sizing the download.

   srcset + sizes is the right tool for an image that fills a known slice
   of the page, but it cannot describe this one. `sizes` only ever
   expresses a WIDTH, and a contained image is usually limited by HEIGHT
   instead — a portrait on a wide desktop displays at ~30vw while
   sizes:100vw tells the browser to fetch as though it were full-bleed.
   That is the bug: the viewer always pulled the largest file on the
   ladder no matter how small the window was.

   We know the aspect ratio from the JSON, so the displayed size can just
   be computed and one exact file requested.
--------------------------------------------------------------------------- */
const DPR_CAP = 2;   // 3× on a phone is invisible and costs ~2.2× the bytes
let loadedLBWidth = 0;

// Measured, not hardcoded, so it always agrees with the CSS above.
function lbAvailable() {
  const el = $('.lb-body');
  if (!el || !el.clientWidth) return { w: innerWidth, h: innerHeight };
  const cs = getComputedStyle(el);
  const w = el.clientWidth  - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight  || 0);
  const h = el.clientHeight - parseFloat(cs.paddingTop  || 0) - parseFloat(cs.paddingBottom || 0);
  return { w: w > 0 ? w : innerWidth, h: h > 0 ? h : innerHeight };
}

// Displayed width of a contained image, then snapped up the ladder.
// Snapping (rather than asking for an arbitrary width) keeps the CDN
// cache working — everyone requests the same four sizes.
function lbTargetWidth(f) {
  const a = lbAvailable();
  const arn = f.arn || 1.5;
  const cssW = Math.min(a.w, a.h * arn);
  const need = Math.ceil(cssW * Math.min(window.devicePixelRatio || 1, DPR_CAP));
  return WIDTHS.find(w => w >= need) || WIDTHS[WIDTHS.length - 1];
}

function drawLB() {
  const f = FLAT[lbi]; if (!f) return;
  lbImg.classList.remove('ready');
  // No srcset here — the width is computed, not negotiated.
  lbImg.removeAttribute('srcset');
  lbImg.removeAttribute('sizes');
  lbImg.alt = `Photograph ${pad(lbi+1)}`;
  lbImg.decoding = 'async';
  lbImg.fetchPriority = 'high';

  loadedLBWidth = lbTargetWidth(f);
  lbImg.src = sized(f.url, loadedLBWidth);

  const show = () => lbImg.classList.add('ready');
  if (lbImg.complete && lbImg.naturalWidth) show();
  else { lbImg.addEventListener('load', show, { once:true });
         lbImg.addEventListener('error', show, { once:true }); }

  $('#lb-count').textContent = `${pad(lbi+1)}/${pad(FLAT.length)}`;
}

/* Rotating a phone can double the available width. Upgrade when that
   happens, but never re-request a smaller file — the bigger one is
   already cached and downscales for free. */
let lbResizeTimer = null;
addEventListener('resize', () => {
  if (!lb.classList.contains('open')) return;
  clearTimeout(lbResizeTimer);
  lbResizeTimer = setTimeout(() => {
    const f = FLAT[lbi]; if (!f) return;
    const need = lbTargetWidth(f);
    if (need > loadedLBWidth) { loadedLBWidth = need; lbImg.src = sized(f.url, need); }
  }, 250);
}, { passive:true });
$('#lb-close').addEventListener('click', closeLB);
$('#lb-prev').addEventListener('click', () => stepLB(-1));
$('#lb-next').addEventListener('click', () => stepLB(1));
lb.addEventListener('click', e => { if (e.target === lb || e.target.closest('.lb-body')) closeLB(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLB();
  if (e.key === 'ArrowLeft')  stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
  if (e.key === 'Tab') { e.preventDefault(); $('#lb-close').focus(); }
});
let tx=0, ty=0;
lb.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
lb.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>45) stepLB(dx>0?-1:1);
}, {passive:true});

/* ============================================================================
   ROUTER
   ============================================================================ */
function parseRoute() {
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!parts.length)               return { name:'index' };
  if (parts[0] === 'w')            return { name:'series', slug:parts[1] };
  if (parts[0] === 'information')  return { name:'information' };
  return { name:'missing' };
}

let current = '';
async function route() {
  const r = parseRoute();
  const key = JSON.stringify(r);
  if (key === current) return;
  current = key;

  const navKey = r.name === 'series' ? 'index' : r.name;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));

  view.classList.add('out');
  await wait(REDUCED ? 0 : 340);

  let el;
  switch (r.name) {
    case 'series':      el = renderSeries(r.slug);  break;
    case 'information': el = renderInformation();   break;
    case 'index':       el = renderIndex();         break;
    default:            el = renderMissing('That page does not exist.');
  }

  view.replaceChildren(el);
  scrollTo({ top:0, behavior:'auto' });

  if (countIO) { countIO.disconnect(); countIO = null; }
  if (r.name === 'series') {
    const s = DATA.get(r.slug);
    if (s) initCounter(view, s.photos.length);
  }

  requestAnimationFrame(() => view.classList.remove('out'));
  document.title = r.name === 'series' && DATA.get(r.slug)
    ? `${DATA.get(r.slug).title} — Devin Feilen` : 'Devin Feilen';
}
addEventListener('hashchange', route);

/* ============================================================================
   THEME — dark is the default here, so the button offers Light mode
   ============================================================================ */
const themeBtn = $('#theme');
function applyTheme(t) {
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent = t === 'light' ? 'Dark mode' : 'Light mode';
  const m = $('meta[name="theme-color"]');
  if (m) m.content = t === 'light' ? '#f0f0ed' : '#0a0a0a';
}
let theme = 'dark';
try { theme = localStorage.getItem('theme') || 'dark'; } catch(_) {}
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(theme);
  try { localStorage.setItem('theme', theme); } catch(_) {}
});

/* ============================================================================
   BOOT
   ============================================================================ */
(async function init() {
  const loaded = (await Promise.all(SERIES.map(loadSeries))).filter(Boolean);
  loaded.forEach(s => { DATA.set(s.slug, s); s.photos.forEach(p => FLAT.push(p)); });

  if (!loaded.length) {
    view.replaceChildren(renderMissing('Nothing loaded. Serve this over http rather than opening the file directly.'));
    return;
  }
  route();
})();
})();
</script>
