<!-- Applies the saved theme before the first paint, so a returning visitor
     never watches the page flip palettes on load. -->

<style>
/* ============================================================================
   THE WORDMARK FACE

   Comico, self-hosted from /fonts/. Fontshare's free licence covers web
   use and the download ships these exact webfont files for the purpose.
   The same licence forbids modifying the font, so it is NOT subsetted —
   which is why it's 332 KB for two words. `swap` means Space Mono renders
   immediately and Comico takes over when it arrives, so nothing is ever
   invisible while it loads.
   ============================================================================ */
@font-face{
  font-family:'Comico';
  src:url('fonts/Comico-Regular.woff2') format('woff2'),
      url('fonts/Comico-Regular.woff')  format('woff');
  font-weight:400;          /* the only weight there is — see .name below */
  font-style:normal;
  font-display:swap;
}

/* ============================================================================
   THE INTERFACE FACE — Supreme, self-hosted from /fonts/

   Two files, and the split is deliberate. The roman is the VARIABLE font:
   one 30 KB file covering every weight from Thin to Extrabold, so the
   navigation can be Extrabold and the Information paragraph can be
   Regular without a second download.

   The italic is a separate STATIC file, because Supreme's variable font
   carries a weight axis and nothing else — there is no slant axis. Roman
   and italic are two unrelated outlines as far as the browser is
   concerned, which is the whole reason the hover below is built the way
   it is. See .morph.

   Only Extrabold Italic is shipped; it's the one italic the site uses.
   Fontshare's licence permits web use and forbids modification, so
   neither file is subsetted.
   ============================================================================ */
@font-face{
  font-family:'Supreme';
  src:url('fonts/Supreme-Variable.woff2') format('woff2'),
      url('fonts/Supreme-Variable.woff')  format('woff');
  font-weight:100 800;      /* a range, not a value — this is the variable font */
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Supreme';
  src:url('fonts/Supreme-ExtraboldItalic.woff2') format('woff2'),
      url('fonts/Supreme-ExtraboldItalic.woff')  format('woff');
  font-weight:800;
  font-style:italic;
  font-display:swap;
}

/* ============================================================================
   A SMALL SCALE — four sizes, each with exactly one job.

   The site ran on a single 13px size for a long time. The wordmark broke
   that first, and the larger navigation and category names finish the
   job. Four is still a scale rather than a free-for-all: wordmark,
   category, nav, everything-else. Nothing on the photographs themselves —
   no captions, no titles, no numbers.
   ============================================================================ */
:root{
  --bg:#EAE7E2;
  --fg:#1B1B1C;          /* 13.9:1 */
  --fg-dim:#6B675F;      /* 4.6:1  */
  --sunk:#DEDAD3;

  /* ── THE INTERFACE FACE ────────────────────────────────────────────
     Everything except the wordmark. Swap the one line below to change
     the whole site; the alternatives are loaded in the <head> so you can
     try each without touching anything else. Open _font-options.html to
     see them side by side.

       'Inter'              neutral grotesque — gets out of the way   ← in use
       'DM Sans'            geometric, a little warmer
       'Work Sans'          friendlier, slightly quirky
       'Newsreader'         editorial serif, more voice
       'Space Mono'         what the site used before — technical, cold
     ------------------------------------------------------------------ */
  --ui:'Supreme';
  --font:var(--ui),ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;

  /* A small scale, now that the wordmark has already broken the
     single-size rule. Three sizes, each with one job. */
  --size:15px;                          /* Information, the toggle */
  --nav:clamp(16px,1.45vw,20px);        /* PHOTOGRAPHY, INFORMATION */
  --cat:clamp(26px,3.2vw,42px);         /* the category names */
  --heavy:800;                          /* Extrabold — nav and categories */
  --morph:.2s;                          /* roman to italic on hover */
  --lh:1.45;
  --track:0.01em;

  --edge:clamp(10px,2vw,28px);
  --head-h:clamp(104px,13vh,150px);     /* what the fixed header occupies */
  --pile-w:clamp(120px,19vmin,240px);   /* base tile width on the front page */
  --cell:clamp(104px,13vmin,168px);     /* contact-sheet thumbnail */
  --cell-gap:6px;
  --tone:#DFDBD4;                       /* stand-in until a photo's own colour is known */

  /* One photograph per screen, so it can be far larger than it was when
     frames sat beside each other. Capped by height and by width at once;
     clamp() keeps it tracking the window without growing forever on a
     27" monitor. */
  --imgh:clamp(180px, 78svh, 1100px);
  --imgw:min(88vw, 1600px);

  --ease:cubic-bezier(.4,0,.2,1);
  --fade:520ms;

  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-t:env(safe-area-inset-top,0px);
  --edge-l:calc(var(--edge) + var(--sa-l));
  --edge-r:calc(var(--edge) + var(--sa-r));
}
[data-theme="dark"]{
  --bg:#0a0a0a; --fg:#ffffff; --fg-dim:#8a8a8a; --sunk:#161616;
  --tone:#17171a;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,p,figure,ul,li,h1,h2{margin:0;padding:0}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

html,body{background:var(--bg)}
body{
  color:var(--fg);
  font-family:var(--font);
  font-size:var(--size);
  line-height:var(--lh);
  letter-spacing:var(--track);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  text-size-adjust:100%;
}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}

a,button{touch-action:manipulation}
a{color:inherit;text-decoration:none}
.dim{color:var(--fg-dim)}

a.h,button.h{transition:color .45s var(--ease)}
a.h:hover,button.h:hover,a.h:focus-visible,button.h:focus-visible{color:var(--fg-dim)}
a.h.on{color:var(--fg-dim)}

.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--fg);color:var(--bg);padding:10px}
.skip:focus{left:0}

/* ============================================================================
   THEME SWITCHING
   Only `body` used to carry a colour transition, so its text faded while
   everything setting a colour of its own snapped. One rule turns a
   transition on for everything, for exactly as long as the switch takes.
   ============================================================================ */
html.theming, html.theming *, html.theming *::before, html.theming *::after{
  transition:background-color .45s var(--ease),
             background-image .45s var(--ease),
             color .45s var(--ease),
             border-color .45s var(--ease),
             outline-color .45s var(--ease) !important;
}

/* ============================================================================
   THE HEADER
   Two centred lines, fixed to the top: the name, and beneath it the two
   destinations. Photographs run to the edges below it, so it carries a
   short wash of background to stay legible over a full-bleed frame.
   ============================================================================ */
.head{
  position:fixed;top:0;left:0;right:0;z-index:50;
  text-align:center;
  padding:calc(18px + var(--sa-t)) var(--edge-r) 20px var(--edge-l);
  background:linear-gradient(to bottom,var(--bg) 55%,transparent);
  pointer-events:none;
}
.head a,.head button{pointer-events:auto}
/* The one deliberate exception to the single type size. A wordmark is
   closer to a mark than to text, and this is the only place it appears.

   font-weight stays at 400. Comico ships Regular only, so asking for 700
   makes the browser synthesise a fake bold — it smears the outlines of a
   marker face and looks noticeably worse than the real thing. The weight
   here comes from the size and from the face itself, which is already
   heavy. The 5° slant is the typeface's own; it isn't italic. */
.head .name{
  display:inline-block;
  font-family:'Comico',var(--font);
  font-size:clamp(26px, 4.4vw, 52px);
  font-weight:400;
  line-height:1.06;
  letter-spacing:.03em;
  padding:0;margin:0;      /* the shared .head a tap padding would skew it */
}
.head .to{display:block;margin-top:10px;font-size:var(--nav);letter-spacing:.05em;
  font-weight:var(--heavy)}
/* Tap targets. 13px of bare text is a 16px-tall target — unusable with a
   thumb. Padding grows the hit area without moving the text a pixel. */
.head a{padding:8px 5px;margin:-8px -5px;display:inline-block}

/* The toggle sits out of the way in the corner rather than joining the
   header, which would break its symmetry. */
.corner{
  position:fixed;right:var(--edge-r);bottom:calc(14px + var(--sa-b));z-index:50;
}
.corner button{padding:12px 6px;margin:-12px -6px;display:inline-block}
/* "Light mode" is 10 characters and "Dark mode" is 9; a reserved width
   stops that one character shifting the corner on every switch. */
#theme{min-width:calc(10ch + 12px);text-align:right}

html.renovating .head .to{display:none}

/* ============================================================================
   VIEWS
   ============================================================================ */
#view{opacity:1;transition:opacity var(--fade) var(--ease)}
#view.out{opacity:0}

/* ============================================================================
   ROMAN → ITALIC ON HOVER

   Supreme's variable font has a weight axis and no slant axis, so the
   browser cannot interpolate roman to italic the way it interpolates a
   weight. They are two separate files of two separate outlines. Supreme's
   italic is a true italic, not a slanted roman — its 'a' is single-storey,
   a different letter entirely — so faking it with transform:skewX() would
   slant the wrong shapes and never show the real thing.

   So the transition is a cross-fade between the two cuts, laid exactly on
   top of one another. The reason that works cleanly here rather than
   looking like a double exposure is that the two cuts set to the same
   width: PHOTOGRAPHY, INFORMATION, Bikes, Running, Singles, Couples and
   A&B are all identical to the pixel, and only Cars differs, by 2.4%.
   The letters slide into their italic forms in place instead of drifting.

   The italic layer is a ::after carrying the same text, which keeps the
   markup to one node and means the roman is what gets selected, read and
   copied. It renders at opacity:0 from the start, so the italic file is
   fetched on load rather than on the first hover — otherwise the first
   pass over a word would fade into a fallback.

   `padding:inherit` plus left/right:0 lands the pseudo's content box
   exactly on the parent's, so the two cuts sit atop each other whatever
   tap padding the element carries.
   ============================================================================ */
.morph{position:relative;display:inline-block;font-weight:var(--heavy)}
.morph>span{display:block;transition:opacity var(--morph) var(--ease)}
.morph::after{
  content:attr(data-t);
  position:absolute;left:0;right:0;top:0;
  padding:inherit;
  font-style:italic;
  font-weight:var(--heavy);
  text-align:inherit;
  opacity:0;
  transition:opacity var(--morph) var(--ease);
  pointer-events:none;
}
/* Hover only. On a touch screen there is no hover state to leave, so the
   italic would stick after a tap and never come back. */
@media (hover:hover) and (pointer:fine){
  .morph:hover>span,.morph:focus-visible>span{opacity:0}
  .morph:hover::after,.morph:focus-visible::after{opacity:1}
}
/* The blanket reduced-motion rule above already collapses this to an
   instant swap rather than removing it — the italic still appears, it
   just doesn't travel there. */

/* ---- The category list ---- */
.cats{min-height:100svh;display:grid;place-items:center;
  padding:0 var(--edge-r) 0 var(--edge-l)}
.cats-inner{display:grid;justify-items:center;gap:0;text-align:center}
.cats a{
  display:block;
  font-size:var(--cat);
  line-height:1.18;
  letter-spacing:-.01em;   /* large type wants less tracking, not more */
  font-weight:var(--heavy);
  padding:6px 0;
  transition:color .45s var(--ease);
}
@media (hover:hover) and (pointer:fine){
  .cats-inner:hover a{color:var(--fg-dim)}
  .cats-inner:hover a:hover{color:var(--fg)}
}

/* ---- Race galleries, hung off the bottom of the category list ----
   Deliberately much smaller than a category and set apart by space rather
   than a rule. These are events, not bodies of work; they shouldn't read as
   a seventh category. */
.races{margin-top:clamp(30px,5vh,58px);text-align:center}
.races-open{
  font-size:var(--nav);
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--fg-dim);
  padding:8px 6px;margin:-8px -6px;
}
.races-open:hover,.races-open:focus-visible{color:var(--fg)}
.races-open::after{content:' +';font-feature-settings:'tnum'}
.races-open[aria-expanded="true"]::after{content:' –'}
.races-list{
  display:grid;justify-items:center;gap:9px;
  margin-top:0;
  opacity:0;max-height:0;overflow:hidden;
  transition:opacity .26s var(--ease), max-height .26s var(--ease), margin-top .26s var(--ease);
}
.races-list.open{opacity:1;max-height:60vh;margin-top:16px}
.races-list a,.races-list .races-soon{font-size:clamp(15px,1.25vw,18px);line-height:1.4}
.races-soon{color:var(--fg-dim)}
.races-when{color:var(--fg-dim)}
/* The category hover-dim must not reach in here — it would grey these out
   whenever the pointer is anywhere over the list above. */
@media (hover:hover) and (pointer:fine){
  .cats-inner:hover .races a{color:var(--fg-dim)}
  .cats-inner:hover .races a:hover{color:var(--fg)}
}

/* ============================================================================
   RACE GALLERIES — a contact sheet

   A different job from the rest of the site. The portfolio is arranged; this
   is five hundred photographs a rider needs to scan through to find
   themselves. So: small, dense, uniform, croppable, and fast.

   `object-fit:cover` crops each thumbnail to a common rectangle. On the
   portfolio that would be vandalism; on a contact sheet it's what makes the
   grid scannable, and the full frame is one click away.

   `content-visibility:auto` with a reserved size is what makes 500 cells
   affordable — the browser skips layout and paint for anything off screen,
   and `contain-intrinsic-size` stops the scrollbar from lying while it does.
   Windowing then handles the images themselves.
   ============================================================================ */
.race{padding:calc(var(--head-h) + 8px) var(--edge-r) 14vh var(--edge-l)}
.race-head{max-width:44rem;margin:0 auto 22px;text-align:center}
/* Deliberately small and quiet. It has to be readable on arrival, not
   negotiated with — so it sits in the header rather than a footer nobody
   scrolls 500 thumbnails to reach. */
.race-credit{
  position:relative;
  margin:0 auto;max-width:44rem;
  padding:2px 34px;
  text-align:center;
  font-size:13px;line-height:1.55;color:var(--fg-dim);
  cursor:pointer;
  max-height:220px;overflow:hidden;
  transition:opacity .18s var(--ease), max-height .18s var(--ease),
             margin-top .18s var(--ease), padding .18s var(--ease);
}
.race-credit a{text-decoration:underline;text-underline-offset:2px;color:var(--fg);cursor:pointer}
/* Its own line, as in the message it was written from. */
.race-credit .coffee{display:block;margin-top:7px}
/* Collapsed as well as faded, so dismissing it doesn't leave a hole above
   the sheet. Quick — this is an acknowledgement, not an animation. */
.race-credit.gone{opacity:0;max-height:0;margin-top:0;padding-top:0;padding-bottom:0;pointer-events:none}
.race-x{
  position:absolute;top:-2px;right:0;
  width:26px;height:26px;display:grid;place-items:center;
  color:var(--fg-dim);font-size:15px;line-height:1;border-radius:2px;
}
.race-credit:hover .race-x{color:var(--fg)}

.sheet{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));
  gap:var(--cell-gap);
}
.cell{
  position:relative;
  aspect-ratio:3/2;
  content-visibility:auto;
  contain-intrinsic-size:auto var(--cell);
  background-color:var(--c,var(--tone));
  overflow:hidden;
}
.cell img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .4s var(--ease);
}
.cell img.ready{opacity:1}
.cell .hit{position:absolute;inset:0;cursor:zoom-in;border:0;background:none;padding:0}
.cell:focus-within{outline:2px solid var(--fg);outline-offset:2px}

/* Select and download sit in opposite corners so neither is hit by accident
   while scanning. They stay visible on touch, where there is no hover. */
.cell .tick,.cell .grab{
  position:absolute;z-index:2;
  width:34px;height:34px;
  display:grid;place-items:center;
  background:var(--bg);color:var(--fg);
  border:1px solid var(--rule,rgba(128,128,128,.4));
  border-radius:2px;cursor:pointer;
  opacity:0;transition:opacity .18s var(--ease);
  font-size:13px;line-height:1;
}
.cell .tick{top:6px;left:6px}
.cell .grab{top:6px;right:6px}
.cell:hover .tick,.cell:hover .grab,
.cell:focus-within .tick,.cell:focus-within .grab,
.cell.picked .tick{opacity:1}
@media (hover:none){ .cell .tick,.cell .grab{opacity:1} }
.cell.picked{outline:3px solid var(--fg);outline-offset:-3px}
.cell.picked .tick{background:var(--fg);color:var(--bg)}

/* The bar only exists once something is selected, so it never sits there
   taking up room and asking to be ignored. */
.race-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  padding:12px calc(var(--edge-r) + 8px) calc(12px + var(--sa-b)) calc(var(--edge-l) + 8px);
  background:var(--bg);border-top:1px solid var(--rule,rgba(128,128,128,.35));
  display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;
  transform:translateY(110%);transition:transform .28s var(--ease);
}
.race-bar.up{transform:translateY(0)}
.race-bar button{text-decoration:underline;text-underline-offset:3px}
.race-bar button[disabled]{opacity:.45;cursor:default;text-decoration:none}
.race-count{font-weight:var(--heavy)}
.race-progress{color:var(--fg-dim)}

/* A phone gets far bigger thumbnails. 104px squares are fine on a laptop
   where you can see forty at once; on a 390px screen they're three to a row
   and too small to recognise a face in — which is the entire task here.
   Two up, and more scrolling, is the right trade. */
@media (max-width:600px){
  :root{--cell:calc((100vw - (2 * var(--edge)) - 8px) / 2);--cell-gap:8px}
  .race{padding-top:calc(var(--head-h) + 4px)}
  /* Portraits lose too much to a 3:2 crop at this size. */
  .cell{aspect-ratio:4/3}
  /* Thumb-sized controls, always visible since there's no hover. */
  .cell .tick,.cell .grab{width:42px;height:42px;font-size:16px}
  .cell .tick{top:8px;left:8px}
  .cell .grab{top:8px;right:8px}
  .race-bar{gap:14px;font-size:15px}
  .race-bar button{padding:6px 2px}
}
@media (min-width:601px) and (max-width:900px){
  :root{--cell:calc((100vw - (2 * var(--edge)) - (2 * 8px)) / 3);--cell-gap:8px}
  .race{padding-top:calc(var(--head-h) + 4px)}
  .cell .tick,.cell .grab{width:40px;height:40px}
}

/* ============================================================================
   THE MORPH — a thumbnail becoming the full photograph

   Both the tile and the lightbox image are given the same
   view-transition-name for the length of the animation, and the browser
   works out the flight path between them. Only one element may carry a
   given name at a time, which is why it's applied immediately before and
   stripped immediately after rather than living in the stylesheet.

   `mix-blend-mode:normal` matters: the default is plus-lighter, which
   cross-fades two copies of the same photograph into something visibly
   brighter than either of them halfway through.

   This is enhancement only. Without startViewTransition — or with reduced
   motion asked for — the lightbox simply opens, as it always did.
   ============================================================================ */
::view-transition-group(photo){
  animation-duration:.42s;
  animation-timing-function:cubic-bezier(.4,0,.2,1);
}
::view-transition-old(photo),::view-transition-new(photo){
  mix-blend-mode:normal;
  height:100%;
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*){animation:none!important}
}

/* ============================================================================
   THE FRONT PAGE — a pile

   Every photograph, scattered over one screen, fading in on top of one
   another. Three decisions worth knowing:

   Tiles are positioned by their CENTRE, not their top-left corner. Most of
   these photographs arrive without dimensions in the JSON, so the height
   of a tile isn't known until the image lands. Centre-positioning doesn't
   care — a portrait and a landscape both stay where they were put, and
   nothing jumps when the real proportions arrive.

   The scatter is deliberately biased towards the middle. Two random
   numbers averaged, rather than one, which clusters tiles centrally and
   leaves the corners sparse. Uniformly random positions look evenly
   sprinkled, which is the opposite of a pile.

   Stacking order is just DOM order — later arrivals paint on top. No
   z-index bookkeeping, and the pile builds in the order things load.
   ============================================================================ */
.pile{position:relative;min-height:100svh;overflow:hidden}
.pile-field{
  position:absolute;
  top:var(--head-h);
  right:var(--edge-r);
  bottom:calc(12vh + var(--sa-b));
  left:var(--edge-l);
}
.chip{
  position:absolute;
  left:calc(var(--x) * 100%);
  top:calc(var(--y) * 100%);
  width:calc(var(--pile-w) * var(--f,1));
  border:0;padding:0;background:none;
  cursor:zoom-in;
  line-height:0;
  opacity:0;
  transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.94);
  transition:opacity .75s var(--ease), transform .75s var(--ease);
  will-change:opacity,transform;
}
.chip.in{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}
/* The tone sits on the image itself so the coloured area is exactly the
   photograph's footprint. Until it loads there is no intrinsic height to
   give the tile a shape, so an assumed 3:2 reserves one — released the
   moment the real proportions are known. Tiles are centre-positioned, so
   correcting a wrong guess grows the tile about its middle rather than
   shoving the pile around. */
.chip img{display:block;width:100%;height:auto;background-color:var(--c,var(--tone))}
.chip img:not(.ready){aspect-ratio:var(--ar,3/2)}
/* The lift lives on the image rather than the button so it doesn't fight
   the translate/rotate the chip is already carrying. */
@media (hover:hover) and (pointer:fine){
  .chip img{transition:transform .3s var(--ease)}
  .chip:hover{z-index:60}
  .chip:hover img{transform:scale(1.04)}
}
.pile-tail{
  position:absolute;left:0;right:0;
  bottom:calc(5vh + var(--sa-b));
  text-align:center;z-index:70;
  font-size:var(--nav);
}

/* ============================================================================
   THE FLOW — one photograph at a time

   Every frame gets a full screen to itself and the scroll comes to rest on
   each. `mandatory` guarantees you always land on a photograph rather than
   between two; `scroll-snap-stop:always` is the half that matters, because
   without it a hard flick skips three or four at once.

   The easing is the browser's own. It already reads as a settle rather
   than a jump, and hand-rolling it feels worse.
   ============================================================================ */
html{scroll-snap-type:y mandatory}

.flow{padding:0}

.plate{
  min-height:100svh;
  display:grid;place-items:center;
  /* The header is fixed over the top of this, so the padding is what
     keeps a centred photograph clear of it rather than tucked underneath. */
  padding:var(--head-h) var(--edge-r) 7vh var(--edge-l);
  scroll-snap-align:center;
  scroll-snap-stop:always;
}

/* width:100% is load-bearing. A <button> is shrink-to-fit, so without it
   the frame's percentage width resolves against a button whose width
   depends on the frame — circular, resolved at zero, and the photograph
   loads but is invisible. */
.open{display:block;width:100%;cursor:zoom-in}

.frame{
  position:relative;overflow:hidden;background:var(--sunk);
  /* Capped by width and by height at once; whichever binds first wins, so
     any shape fills as much of the screen as it can without cropping. */
  width:min(var(--imgw), calc(var(--imgh) * var(--arn,1.5)));
  max-width:100%;
  margin-inline:auto;
  aspect-ratio:var(--ar,3/2);
}
/* Without dimensions in the JSON we can't reserve the true shape, but we
   must reserve something — a frame with no size is a blank page until the
   file lands. adoptRatio() corrects this the moment the image decodes. */
.frame.auto{aspect-ratio:3/2}
.frame.auto img{object-fit:contain}

.frame{background-color:var(--c,var(--tone))}
.frame img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  /* The whole entrance: each photograph fades up once decoded. A failed
     image stays at 0, so you see an empty frame rather than its alt text. */
  opacity:0;transition:opacity 1.2s var(--ease);
}
.frame img.ready{opacity:1}

/* Also a snap target. Under `mandatory` the scroller must come to rest on
   one, so without this the last photograph becomes a floor you can't
   scroll past and the link is unreachable. */
.flow-end{
  min-height:60svh;display:grid;place-items:center;
  padding:0 var(--edge-r) 0 var(--edge-l);
  scroll-snap-align:center;
}

/* ============================================================================
   INFORMATION + THE RENOVATION NOTICE
   ============================================================================ */
.info{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.info-inner{max-width:34rem}
.info-inner p{padding:2px 0}

.reno{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
.reno-inner{display:grid;justify-items:center;gap:22px;text-align:center;max-width:30rem}
.reno-toggle{padding:10px 14px;margin:-10px -14px}
.reno-info{display:grid;gap:2px;opacity:0;transform:translateY(-4px);
  transition:opacity .45s var(--ease),transform .45s var(--ease)}
.reno-info.open{opacity:1;transform:none}

/* ============================================================================
   LIGHTBOX
   ============================================================================ */
.lb{--lb-pad-x:calc(var(--edge-l) + var(--edge-r));
    --lb-pad-y:calc(112px + var(--sa-t) + var(--sa-b));
    position:fixed;inset:0;z-index:200;background:var(--bg);display:none;opacity:0;
    transition:opacity .45s var(--ease);overscroll-behavior:contain;touch-action:none}
.lb.open{display:block}
.lb.shown{opacity:1}
.lb-body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(56px + var(--sa-t)) var(--edge-r) calc(56px + var(--sa-b)) var(--edge-l)}
/* max-height:100% cannot be used here: in a flex container whose track is
   auto-sized, the percentage resolves against a track sized by the image —
   circular, so browsers drop it and a tall portrait runs off the bottom. */
.lb-body img{
  display:block;width:auto;height:auto;
  max-width:calc(100vw - var(--lb-pad-x));
  max-height:calc(100svh - var(--lb-pad-y));
  object-fit:contain;
  opacity:0;transition:opacity .45s var(--ease);
}
.lb-body img.ready{opacity:1}
.lb-bar{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  display:flex;justify-content:flex-end;align-items:baseline;
  padding:0 var(--edge-r) 0 var(--edge-l);gap:20px;pointer-events:none}
.lb-bar > *{pointer-events:auto}
.lb-nav{display:flex;gap:8px;align-items:baseline}
.lb-bar button{padding:12px 6px;margin:-12px -6px;display:inline-block}

/* ============================================================================
   NARROW SCREENS
   The rhythm needs width to read as composition. Below 900px it collapses
   to one full-width column — offsets and overlaps at phone width look
   like a mistake rather than a decision.
   ============================================================================ */
@media (max-width:900px){
  :root{--imgh:clamp(180px, 66svh, 760px);--imgw:94vw}
  .lb{--lb-pad-y:calc(126px + var(--sa-t) + var(--sa-b))}
  .lb-body{padding:calc(48px + var(--sa-t)) var(--edge-r) calc(78px + var(--sa-b)) var(--edge-l)}
  .lb-bar{top:auto;bottom:0;transform:none;
    padding:16px var(--edge-r) calc(14px + var(--sa-b)) var(--edge-l);
    background:linear-gradient(to top,var(--bg) 58%,transparent)}
}
@media (max-width:700px){
  :root{--edge:16px;--imgh:clamp(160px, 60svh, 620px);--head-h:clamp(88px,11vh,112px);
        --pile-w:clamp(86px,26vmin,150px)}
}

/* ============================================================================
   REDUCED MOTION — all of this is decoration.
   ============================================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
  .frame{background-color:var(--c,var(--tone))}
.frame img{opacity:1}
  #view.out{opacity:1}
  html.theming,html.theming *,html.theming *::before,html.theming *::after{
    transition-duration:.001ms!important;
  }
  /* Mandatory snap moves the page without being asked, which is exactly
     what this preference is about. Proximity still helps you land on a
     photograph but never overrides a deliberate scroll. */
  html{scroll-snap-type:y proximity}
}
.boot{min-height:100svh;display:grid;place-items:center;padding:0 var(--edge-r) 0 var(--edge-l)}
</style>
<noscript><style>#view,.head .to,.corner{display:none}</style></noscript>
</head>

<body>
<a class="skip" href="#/">Skip to content</a>

<header class="head">
  <a class="name h" href="#/">DEVIN FEILEN</a>
  <span class="to">
    <a class="h morph" href="#/photography" data-nav="photography" data-t="PHOTOGRAPHY" aria-label="Photography"><span>PHOTOGRAPHY</span></a><span aria-hidden="true">,</span>
