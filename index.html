  </span>
</header>

<div class="corner"><button class="h" id="theme">Dark mode</button></div>

<main id="view"><div class="boot"><p class="dim">Loading</p></div></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-body"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span class="lb-nav">
      <button class="h" id="lb-prev">Prev</button>
      <button class="h" id="lb-next">Next</button>
      <button class="h" id="lb-save" hidden>Save</button>
      <button class="h" id="lb-close">Close</button>
    </span>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================================
   CONFIGURATION
   ============================================================================ */
const CDN = 'https://devinfeilen.b-cdn.net';

// Bunny Optimizer resizes via ?width=. If it's off on your pull zone the
// parameter is ignored and you get originals — safe either way, but turn
// it on: it is most of the weight saving available here.
const USE_OPTIMIZER = true;
const WIDTHS = [320, 640, 1000, 1500, 2200];   /* 320 exists for the front-page pile */

/* THE CATEGORIES.

   `title` is the only word anyone sees. `slug` is the URL. `sources` is
   which JSON files feed the category — one each now that the Bunny
   folders match the categories, so folder / JSON file / source name are
   all the same word.

   `sources` stays an array because it costs nothing and it's the escape
   hatch: if you later want, say, Racing to pull from two folders, add a
   second name rather than moving files around on the CDN.

   A category whose file is missing or empty simply doesn't appear — no
   error, nothing broken — so you can add these one at a time. */
/* `sources` must match your JSON filenames exactly, capitals included —
   these are `AB.json`, `Bikes.json` and so on, sitting next to
   index.html. `slug` is the URL and is kept lowercase because URLs
   should be. `title` is the only thing a visitor ever reads. */
const CATEGORIES = [
  { slug:'bikes',    title:'Bikes',    sources:['Bikes'] },
  { slug:'running',  title:'Running',  sources:['Running'] },
  { slug:'cars',     title:'Cars',     sources:['Cars'] },
  { slug:'candids',  title:'Candids',  sources:['Singles'] },
  { slug:'couples',  title:'Couples',  sources:['Couples'] },
  { slug:'ab',       title:'A&B',      sources:['AB'] }
];

/* How many photographs the front page shows, drawn at random from every
   category. Picked once when the page loads and held for the visit, so
   moving between Photography and back doesn't reshuffle underneath you.
   A reload gives a new five.

   This is the only randomness on the site — the sequence inside each
   category is exactly the order of its JSON file, unshuffled. */
/* THE FRONT-PAGE PILE.

   Every photograph in every file, scattered over one screen and fading in
   on top of one another. The numbers below are the whole safety story:

   PILE_MOBILE_MAX  a phone gets a subset. 90 tiles on a 390px screen is
                    neither legible nor survivable.
   PILE_CONCURRENCY how many are in flight at once. Bunny speaks HTTP/2, so
                    without a limit the browser would open all ninety
                    simultaneously and every one would arrive slowly.
   PILE_RAW_CAP     the emergency brake. See pileGuard(). */
const PILE_MOBILE_MAX  = 30;
const PILE_STAGGER     = 45;    /* ms between reveals */
const PILE_CONCURRENCY = 8;
const PILE_RAW_CAP     = 12;
/* How long a single tile may hold its slot. Not a load timeout — the image
   carries on arriving — just the point at which the queue stops waiting
   for it and lets the rest through. */
const PILE_TIMEOUT     = 5000;

/* Safety cap per file, not a curation tool — with the site down to ~53
   photographs every one should appear. This only stops a stale or
   accidentally restored file dumping a hundred frames into a category. */
const MAX_PER_FILE = 40;


const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches:false });
const REDUCED = mq('(prefers-reduced-motion: reduce)').matches;

/* ============================================================================
   UTILITIES
   ============================================================================ */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* replaceChildren() is Safari 14+. On an older iPhone it throws, the
   router dies, and nothing renders — indistinguishable from a blank site. */
const swapIn = (parent, el) => { parent.textContent = ''; parent.appendChild(el); };

const urlFor = (slug,f) => /^https?:\/\//i.test(f) ? f : `${CDN}/${slug}/${f}`;
const sized  = (u,w) => USE_OPTIMIZER ? u + (u.includes('?')?'&':'?') + 'width=' + w : u;
const srcset = u => USE_OPTIMIZER ? WIDTHS.map(w=>`${sized(u,w)} ${w}w`).join(', ') : '';

/* ============================================================================
   STATE
   ============================================================================ */
const DATA = new Map();   // slug -> { ...category, photos }
let HOME = [];            // the front page's random handful
let RACES = [];           // race galleries, from races/index.json
let RENOVATING = false;

/* Fisher–Yates over a copy. Doing it this way rather than sorting by
   Math.random() matters: a random comparator is not a valid sort, and it
   skews the result badly — some positions come up far more often than
   others. This is the only shuffle on the site: the front page and every
   category both go through it. */
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function adoptRatio(plate, frame, img, p) {
  if (p.ar) return;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  p.ar = `${w} / ${h}`; p.arn = w / h;
  frame.style.setProperty('--ar', p.ar);
  frame.style.setProperty('--arn', p.arn);
  frame.classList.remove('auto');
}

/* ============================================================================
   DECODED-MEMORY WINDOWING

   `loading="lazy"` says when an image is fetched but nothing about when
   it's released. Once decoded it stays decoded, and a 6192×4128 original
   is ~102 MB *each*. On iOS — so in every iOS browser, since they all run
   WebKit — the renderer stops decoding long before a dozen of those and
   images simply never appear.

   So a src is attached only near the viewport and removed once well past.
   The frame keeps its reserved box and placeholder, so a detached frame
   looks exactly like one that hasn't loaded yet.
   ============================================================================ */
const KEEP_NEAR = '120% 0px';
let windowIO = null;

function attachImage(img) {
  if (img.dataset.on === '1') return;
  img.dataset.on = '1';
  mount(img, img.dataset.url, { sizes: img.dataset.sizes, eager: img.dataset.eager === '1' });
  const p = img.__photo, frame = img.__frame, plate = img.__plate;
  if (p && frame && !p.ar) {
    const learn = () => adoptRatio(plate, frame, img, p);
    if (img.complete && img.naturalWidth) learn();
    else img.addEventListener('load', learn, { once:true });
  }
}
function detachImage(img) {
  if (img.dataset.on !== '1') return;
  if (img.dataset.eager === '1') return;
  img.dataset.on = '0';
  img.classList.remove('ready');
  img.removeAttribute('srcset');
  img.removeAttribute('src');
}
function initWindowing(scope) {
  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  const plates = $$('.plate', scope);
  if (!plates.length) return;
  if (!('IntersectionObserver' in window)) {
    $$('.frame img', scope).forEach(attachImage);
    return;
  }
  windowIO = new IntersectionObserver(ents => {
    ents.forEach(e => {
      const img = $('.frame img', e.target);
      if (!img) return;
      if (e.isIntersecting) attachImage(img); else detachImage(img);
    });
  }, { rootMargin: KEEP_NEAR });
  plates.forEach(p => windowIO.observe(p));
}

/* ============================================================================
   IS THE CDN ANSWERING?

   The photo lists live on GitHub Pages, the photographs on Bunny, so the
   two fail independently — the site can load perfectly and show nothing
   but empty frames.

   Two checks: a quick sample up front for a pull zone that's entirely
   dead, and — because a sample is wrong when some files are still cached
   at the visitor's edge and the rest are gone — the real photographs
   report back too. Only definitive errors trigger it; a timeout counts as
   alive, because falsely announcing renovations on a slow phone is far
   worse than briefly showing empty frames.
   ============================================================================ */
const CDN_PROBES = 3, CDN_TIMEOUT = 9000, FAIL_SAMPLE = 3;
let imgTried = 0, imgFailed = 0;

function noteImage(ok) {
  imgTried++;
  if (!ok) imgFailed++;
  if (RENOVATING) return;
  if (imgTried >= FAIL_SAMPLE && imgFailed === imgTried) {
    declareRenovation('every photograph attempted so far has failed to load');
  }
}
function declareRenovation(why) {
  if (RENOVATING) return;
  RENOVATING = true;
  console.warn('Showing the renovation notice — ' + why + '.');
  document.documentElement.classList.add('renovating');
  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  if (parseRoute().name !== 'information') swapIn(view, renderRenovation());
  current = '';
}
function cdnAnswering(urls) {
  if (!urls.length) return Promise.resolve(false);
  return new Promise(resolve => {
    let errors = 0, settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); } };
    const timer = setTimeout(() => done(true), CDN_TIMEOUT);
    urls.forEach(u => {
      const probe = new Image();
      probe.onload  = () => { clearTimeout(timer); done(true); };
      probe.onerror = () => { if (++errors === urls.length) { clearTimeout(timer); done(false); } };
      probe.src = USE_OPTIMIZER ? sized(u, 640) : u;
    });
  });
}
function probeUrls(list) {
  const out = [], step = Math.max(1, Math.floor(list.length / CDN_PROBES));
  for (let i = 0; i < list.length && out.length < CDN_PROBES; i += step) out.push(list[i].url);
  return out;
}

function mount(img, url, { sizes, eager, base, priority } = {}) {
  img.decoding = 'async';
  img.loading = eager ? 'eager' : 'lazy';
  if (priority) img.fetchPriority = priority;
  else if (eager) img.fetchPriority = 'high';
  const ss = srcset(url);
  if (ss) { img.srcset = ss; img.sizes = sizes || '60vw'; }
  img.src = USE_OPTIMIZER ? sized(url, base || 1500) : url;
  const ok  = () => { img.classList.add('ready'); noteImage(true); };
  const bad = () => { img.classList.remove('ready'); noteImage(false); };
  if (img.complete && img.naturalWidth) ok();
  else { img.addEventListener('load',  ok,  {once:true});
         img.addEventListener('error', bad, {once:true}); }
}

/* ============================================================================
   DATA — accepts the object schema or plain arrays of filenames/URLs
   ============================================================================ */
async function loadFile(slug) {
  try {
    const res = await fetch(`${slug}.json`, { cache:'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const raw = await res.json();
    const body = Array.isArray(raw) ? { photos: raw } : raw;
    const list = body.photos || body.images || [];
    return list.slice(0, MAX_PER_FILE).map(item => {
      const o = typeof item === 'string' ? { file:item } : item;
      const w = Number(o.w)||null, h = Number(o.h)||null;
      /* `c` is this photograph's average colour, six hex digits, written by
         make-json.mjs. It fills the frame before the image arrives, so a
         loading page looks like photographs developing rather than holes.
         Entirely optional — without it the frames use a neutral tone. */
      const c = typeof o.c === 'string' && /^#?[0-9a-f]{6}$/i.test(o.c)
              ? '#' + o.c.replace('#','') : null;
      return {
        url: urlFor(slug, o.file || o.src || ''),
        ar:  (w&&h) ? `${w} / ${h}` : null,
        arn: (w&&h) ? (w/h) : null,
        c
        /* `caption` and `place` in the JSON are read by nothing. */
      };
    }).filter(p => p.url);
  } catch (e) {
    console.warn(`[${slug}] ${slug}.json did not load`, e);
    return [];
  }
}

/* ============================================================================
   VIEWS
   ============================================================================ */
const view = $('#view');

function renderCategories() {
  const live = CATEGORIES.filter(c => DATA.has(c.slug));
  const el = document.createElement('div');
  el.className = 'cats';
  el.innerHTML = `<div class="cats-inner">${
    live.map(c => `<a class="h morph" href="#/c/${c.slug}" data-slug="${c.slug}" data-t="${esc(c.title)}" aria-label="${esc(c.title)}"><span>${esc(c.title)}</span></a>`).join('')
  }</div>`;

  /* Race galleries hang off the bottom of this page rather than joining the
     list. They aren't categories — they're events, they date, and there will
     eventually be a lot of them. Kept small and set apart so the six
     categories stay the thing this page is about.

     It's a disclosure rather than a link to another page: with two galleries
     an extra page load to see two words would be silly, and it still works
     when there are twenty. */
  if (RACES.length) {
    const box = document.createElement('div');
    box.className = 'races';
    box.innerHTML =
      `<button type="button" class="h races-open" id="races-open" aria-expanded="false" aria-controls="races-list">Race galleries</button>` +
      `<div class="races-list" id="races-list" hidden>${
        RACES.map(r => {
          const label = `${esc(r.title)}${r.date ? ` <span class="races-when">${esc(r.date)}</span>` : ''}`;
          return r.soon
            ? `<span class="races-soon">${label} <span class="races-when">— soon</span></span>`
            : `<a class="h" href="#/r/${encodeURIComponent(r.slug)}">${label}</a>`;
        }).join('')
      }</div>`;
    const btn = $('#races-open', box), list = $('#races-list', box);
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      if (open) { list.classList.remove('open');
                  setTimeout(() => { if (list.isConnected) list.hidden = true; }, REDUCED ? 0 : 260); }
      else { list.hidden = false; requestAnimationFrame(() => list.classList.add('open')); }
    });
    el.querySelector('.cats-inner').appendChild(box);
  }
  return el;
}

/* One flow builder for every category. `list` is the working set the
   lightbox steps through, so Prev/Next stays inside the category you're
   looking at rather than wandering into another one. */
/* The flow itself, shared by a category and by the front page. `list` is
   also the set the lightbox steps through, so Prev/Next never wanders
   outside what you were looking at. */
function buildFlow(list) {
  const flow = document.createElement('div');
  flow.className = 'flow';

  list.forEach((p, n) => {
    const fig = document.createElement('figure');
    fig.className = 'plate';

    const btn = document.createElement('button');
    btn.className = 'open';
    btn.type = 'button';
    btn.setAttribute('aria-label', `Open photograph ${pad(n+1)}`);

    const frame = document.createElement('div');
    frame.className = 'frame' + (p.ar ? '' : ' auto');
    if (p.ar)  frame.style.setProperty('--ar', p.ar);
    if (p.arn) frame.style.setProperty('--arn', p.arn);
    if (p.c)   frame.style.setProperty('--c', p.c);

    const img = document.createElement('img');
    img.alt = `Photograph ${pad(n+1)}`;   // never shown; a screen reader
    frame.appendChild(img);               // still has to announce something
    btn.appendChild(frame);
    fig.appendChild(btn);
    flow.appendChild(fig);

    img.dataset.url   = p.url;
    img.dataset.sizes = '(max-width:900px) 94vw, 78vw';
    img.dataset.eager = n === 0 ? '1' : '0';
    img.dataset.on    = '0';
    img.__photo = p; img.__frame = frame; img.__plate = fig;
    if (n === 0) attachImage(img);

    btn.addEventListener('click', () => morph(img, () => openLB(list, n, img)));
  });

  return flow;
}

function tail(href, label) {
  const end = document.createElement('div');
  end.className = 'flow-end';
  end.innerHTML = `<a class="h" href="${href}">${esc(label)} &rarr;</a>`;
  return end;
}

/* ============================================================================
   RACE GALLERIES

   Unlisted, self-contained, and deliberately not part of the portfolio: a
   gallery is fetched only when someone visits its address, so five hundred
   photographs cost nothing to anybody else.

   A manifest lives at races/<slug>.json:

     {
       "title":  "Alpenrose Velodrome — Aug 2026",
       "date":   "16 August 2026",
       "note":   "Free to download. Credit appreciated, never required.",
       "folder": "Races/Alpenrose2026",
       "photos": ["AR-0001.jpg", "AR-0002.jpg", ...]
     }

   `folder` is the Bunny path the filenames hang off. Entries may also be
   full URLs, or objects with `c` / `w` / `h`, exactly like the portfolio.
   ============================================================================ */
const RACE_WINDOW   = '250% 0px';   /* how far outside the viewport to keep images */
/* Was a flat 320, which is right for a 168px cell on a laptop and visibly
   soft on a phone now that a cell is half the screen. Measured once per
   render and snapped to the srcset ladder so the CDN cache still works. */
let RACE_THUMB = 320;
function measureThumb(scope) {
  const cell = $('.cell', scope);
  const w = cell ? Math.round(cell.getBoundingClientRect().width) : 0;
  const need = Math.ceil((w || 168) * Math.min(window.devicePixelRatio || 1, 2));
  RACE_THUMB = WIDTHS.find(x => x >= need) || WIDTHS[WIDTHS.length - 1];
}
const RACE_GAP      = 550;          /* ms between files in a batch download */

/* Shown at the top of every gallery. A manifest may override it with its own
   `credit` string, but the default is the one that matters — it's the ask
   that goes out with every set of race photographs. */
const RACE_CREDIT =
  `These images are free for personal use. Please credit ` +
  `<a href="https://instagram.com/devinfeilen" target="_blank" rel="noopener noreferrer">@devinfeilen</a> ` +
  `on Instagram or <a href="https://devinfeilen.com">devinfeilen.com</a> when sharing.` +
  `<span class="coffee">You can ` +
  `<a href="https://buymeacoffee.com/devinfeilen" target="_blank" rel="noopener noreferrer">buy me a coffee</a> ` +
  `for my work.</span>`;

let raceSel = new Set();
let creditDismissed = false;   /* for this visit; see buildSheet */
let raceAbort = false;

function renderRaceLoading() {
  const el = document.createElement('div');
  el.className = 'race';
  el.innerHTML = `<div class="race-head"><p class="race-sub" id="race-status">Loading…</p></div>`;
  return el;
}

async function mountRace(slug, el) {
  let body;
  try {
    const res = await fetch(`races/${slug}.json`, { cache:'no-cache' });
    if (!res.ok) throw new Error(res.status);
    body = await res.json();
  } catch (e) {
    const s = $('#race-status', el);
    if (s) s.textContent = 'That gallery is not here. Check the link you were sent.';
    return;
  }

  const raw = Array.isArray(body) ? body : (body.photos || body.images || []);
  const base = (body.folder || '').replace(/^\/+|\/+$/g, '');
  const photos = raw.map(item => {
    const oo = typeof item === 'string' ? { file:item } : item;
    const f = oo.file || oo.src || oo.url || '';
    const w = Number(oo.w) || null, h = Number(oo.h) || null;
    const c = typeof oo.c === 'string' && /^#?[0-9a-f]{6}$/i.test(oo.c)
            ? '#' + oo.c.replace('#','') : null;
    return {
      url: /^https?:\/\//i.test(f) ? f : `${CDN}/${base ? base + '/' : ''}${f}`,
      name: (f.split('/').pop() || 'photograph.jpg'),
      ar: (w&&h) ? `${w} / ${h}` : null, arn: (w&&h) ? (w/h) : null, c
    };
  }).filter(p => p.url);

  raceSel = new Set();
  if (body.title) document.title = `${body.title} — Devin Feilen`;
  swapIn(el, buildSheet(body, photos));
  initRaceWindowing(el);
}

function buildSheet(meta, photos) {
  const wrap = document.createElement('div');

  /* The header is the notice and nothing else. It used to carry a title, a
     photograph count and the manifest's note as well — which put the count
     on screen twice, and pushed the photographs a long way down a phone.
     The gallery's name is in the tab title and on the link that got you
     here; the count is visible by scrolling. To put the title back, add
     an <h1 class="race-title"> here. */
  const head = document.createElement('div');
  head.className = 'race-head';
  head.innerHTML =
    `<p class="race-credit" id="race-credit" role="note">` +
      `${meta.credit ? esc(meta.credit) : RACE_CREDIT}` +
      `<button type="button" class="race-x" aria-label="Dismiss this notice">&times;</button>` +
    `</p>`;
  wrap.appendChild(head);

  /* Tap anywhere on the notice to be rid of it — except on a link, which
     should do what a link does. Dismissal lasts for this visit only: it
     follows you between galleries but comes back on a reload, because a
     credit request that disappears forever after one stray tap isn't much
     of a request. Change `creditDismissed` to a localStorage flag if you'd
     rather it stayed gone. */
  const credit = $('.race-credit', head);
  if (credit) {
    if (creditDismissed) { credit.classList.add('gone'); credit.hidden = true; }
    const dismiss = () => {
      creditDismissed = true;
      credit.classList.add('gone');
      setTimeout(() => { if (credit.isConnected) credit.hidden = true; }, REDUCED ? 0 : 200);
    };
    credit.addEventListener('click', e => { if (!e.target.closest('a')) dismiss(); });
    credit.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('race-x')) {
        e.preventDefault(); dismiss();
      }
    });
  }

  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  photos.forEach((p, n) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (p.c) cell.style.setProperty('--c', p.c);

    const img = document.createElement('img');
    img.alt = `Photograph ${n+1}`;
    img.dataset.url = p.url;
    img.dataset.on = '0';
    img.__photo = p;
    cell.appendChild(img);

    const hit = document.createElement('button');
    hit.className = 'hit';
    hit.type = 'button';
    hit.setAttribute('aria-label', `Open photograph ${n+1}`);
    hit.addEventListener('click', () => morph(img, () => openLB(photos, n, img, true)));
    cell.appendChild(hit);

    const tick = document.createElement('button');
    tick.className = 'tick';
    tick.type = 'button';
    tick.setAttribute('aria-pressed', 'false');
    tick.setAttribute('aria-label', `Select photograph ${n+1}`);
    tick.textContent = '+';
    tick.addEventListener('click', e => {
      e.stopPropagation();
      const on = raceSel.has(n);
      on ? raceSel.delete(n) : raceSel.add(n);
      cell.classList.toggle('picked', !on);
      tick.setAttribute('aria-pressed', String(!on));
      tick.textContent = on ? '+' : '✓';
      updateRaceBar(photos);
    });
    cell.appendChild(tick);

    const grab = document.createElement('button');
    grab.className = 'grab';
    grab.type = 'button';
    grab.setAttribute('aria-label', `Download photograph ${n+1}`);
    grab.textContent = '↓';
    grab.addEventListener('click', e => { e.stopPropagation(); downloadMany([p]); });
    cell.appendChild(grab);

    sheet.appendChild(cell);
  });

  wrap.appendChild(sheet);
  wrap.appendChild(buildRaceBar(photos));
  return wrap;
}

function buildRaceBar(photos) {
  const bar = document.createElement('div');
  bar.className = 'race-bar';
  bar.id = 'race-bar';
  bar.innerHTML =
    `<span class="race-count" id="race-count">0 selected</span>` +
    `<button type="button" id="race-all">Select all</button>` +
    `<button type="button" id="race-none">Clear</button>` +
    `<button type="button" id="race-get">Download</button>` +
    `<span class="race-progress" id="race-progress"></span>`;
  bar.querySelector('#race-all').addEventListener('click', () => {
    photos.forEach((_, i) => raceSel.add(i));
    $$('.cell').forEach((c, i) => {
      c.classList.add('picked');
      const t = $('.tick', c); if (t) { t.textContent = '✓'; t.setAttribute('aria-pressed','true'); }
    });
    updateRaceBar(photos);
  });
  bar.querySelector('#race-none').addEventListener('click', () => {
    raceSel.clear();
    $$('.cell').forEach(c => {
      c.classList.remove('picked');
      const t = $('.tick', c); if (t) { t.textContent = '+'; t.setAttribute('aria-pressed','false'); }
    });
    updateRaceBar(photos);
  });
  bar.querySelector('#race-get').addEventListener('click', () => {
    const picked = [...raceSel].sort((a,b)=>a-b).map(i => photos[i]).filter(Boolean);
    downloadMany(picked);
  });
  return bar;
}

function updateRaceBar(photos) {
  const bar = $('#race-bar'); if (!bar) return;
  const n = raceSel.size;
  bar.classList.toggle('up', n > 0);
  const c = $('#race-count'); if (c) c.textContent = `${n} selected`;
  const g = $('#race-get');   if (g) g.disabled = n === 0;
}

/* ---------------------------------------------------------------- windowing

   Same idea as the flow, wider margin. `content-visibility` already spares
   the browser laying out cells it can't see; this spares it holding decoded
   bitmaps for them. Five hundred thumbnails attached at once would be about
   135 MB of decoded image — roughly thirty at a time is under ten.        */
let raceIO = null;
function initRaceWindowing(scope) {
  if (raceIO) { raceIO.disconnect(); raceIO = null; }
  const cells = $$('.cell', scope);
  if (!cells.length) return;
  measureThumb(scope);
  if (!('IntersectionObserver' in window)) {
    cells.slice(0, 120).forEach(c => attachThumb($('img', c)));
    return;
  }
  raceIO = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const img = $('img', e.target);
      if (!img) return;
      if (e.isIntersecting) attachThumb(img); else detachThumb(img);
    });
  }, { rootMargin: RACE_WINDOW });
  cells.forEach(c => raceIO.observe(c));
}
function attachThumb(img) {
  if (!img || img.dataset.on === '1') return;
  img.dataset.on = '1';
  img.decoding = 'async';
  img.loading = 'eager';          /* the observer is the throttle, not the browser */
  if ('fetchPriority' in img) img.fetchPriority = 'auto';
  img.src = sized(img.dataset.url, RACE_THUMB);
  const ok = () => img.classList.add('ready');
  /* A photograph in the manifest that isn't on the CDN — an upload that
     stopped short, a file deleted since — takes its cell with it rather
     than sitting there as a coloured rectangle forever. The grid closes up
     and the visitor never learns anything went wrong. */
  const gone = () => { const cell = img.closest('.cell'); if (cell) cell.remove(); };
  if (img.complete && img.naturalWidth) ok();
  else {
    img.addEventListener('load', ok, { once:true });
    img.addEventListener('error', gone, { once:true });
  }
}
function detachThumb(img) {
  if (!img || img.dataset.on !== '1') return;
  img.dataset.on = '0';
  img.classList.remove('ready');
  img.removeAttribute('src');
}

/* ----------------------------------------------------------------- download

   The `download` attribute is ignored on a cross-origin link — the browser
   navigates to the image instead of saving it, which on a phone means the
   photograph opens and the visitor is left to long-press it. So the file is
   fetched as a blob first and saved from memory, which keeps the filename.

   That needs the CDN to send Access-Control-Allow-Origin. If it doesn't, the
   fetch throws and the photograph is opened in a new tab instead — worse,
   but not nothing, and the visitor is told which happened. RACES.md explains
   the one Bunny setting that turns the good path on.                       */
/* WHY A PHONE NEEDS DIFFERENT TREATMENT.

   A blob download on iOS lands in Files, not Photos, and there is no
   setting that changes that — a download is a download. The only route
   into the camera roll from a web page is the share sheet, where "Save
   Image" appears alongside Messages and AirDrop. So on a phone the button
   opens the share sheet; on a desktop, where a share sheet would be an
   irritation, it saves the file as before.

   navigator.share must be called from a user gesture, and fetching the
   photograph first spends some of that budget. iOS has tolerated the await
   since 16, but not universally — so every failure falls through to the
   ordinary download rather than leaving the visitor with nothing. */
const canShareFiles = () => {
  try {
    return typeof navigator.share === 'function' &&
           typeof navigator.canShare === 'function' &&
           navigator.canShare({ files: [new File([new Blob([1])], 'x.jpg', { type:'image/jpeg' })] });
  } catch (e) { return false; }
};

async function grabBlob(url) {
  const res = await fetch(url, { mode:'cors', credentials:'omit' });
  if (!res.ok) throw new Error(res.status);
  return res.blob();
}

function saveBlob(blob, name) {
  const href = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 20000);
}

/* One photograph. Share sheet where that exists, download where it doesn't,
   and the photograph opened in a tab if the CDN refuses the fetch. */
async function downloadOne(p, { preferShare = canShareFiles() } = {}) {
  try {
    const blob = await grabBlob(p.url);
    if (preferShare) {
      const file = new File([blob], p.name, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file] }); return 'shared'; }
        catch (e) {
          /* AbortError means they closed the sheet — that's a decision, not
             a failure, and quietly downloading the file instead would be
             the opposite of what they just asked for. */
          if (e && e.name === 'AbortError') return 'cancelled';
        }
      }
    }
    saveBlob(blob, p.name);
    return 'saved';
  } catch (e) {
    window.open(p.url, '_blank', 'noopener');
    return 'opened';
  }
}

/* Several at once, on a phone: one share sheet holding all of them, so iOS
   offers "Save N Images" straight to the camera roll. Capped, because every
   file is held in memory at the same time and these are full-size
   originals — a dozen is about 60 MB, which is fine; fifty is not. */
const SHARE_MAX = 12;
async function shareMany(list) {
  const files = [];
  for (const p of list) {
    const blob = await grabBlob(p.url);
    files.push(new File([blob], p.name, { type: blob.type || 'image/jpeg' }));
  }
  if (!navigator.canShare({ files })) throw new Error('cannot share this set');
  await navigator.share({ files });
}

async function downloadMany(list) {
  if (!list.length) return;
  const prog = $('#race-progress');
  const stop = $('#race-get');
  raceAbort = false;

  /* On a phone, a modest selection goes out as one share sheet, which is
     the only way these reach Photos rather than Files. Beyond SHARE_MAX
     the memory cost stops being reasonable and it falls back to
     downloading them one at a time. */
  if (canShareFiles() && list.length > 1 && list.length <= SHARE_MAX) {
    if (prog) prog.textContent = `Preparing ${list.length}…`;
    try {
      await shareMany(list);
      if (prog) { prog.textContent = ''; }
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') { if (prog) prog.textContent = ''; return; }
      /* fall through and download them instead */
    }
  }

  let saved = 0, opened = 0, shared = 0, cancelled = 0;

  if (list.length > 1 && stop) {
    stop.textContent = 'Stop';
    stop.disabled = false;
    stop.onclick = () => { raceAbort = true; };
  }

  for (let i = 0; i < list.length; i++) {
    if (raceAbort) break;
    if (prog) prog.textContent = `${i+1} of ${list.length}…`;
    /* Only the first of a run is inside the user's tap, so a share sheet
       per photograph would be blocked after that one. A long run downloads. */
    const how = await downloadOne(list[i], { preferShare: list.length === 1 && canShareFiles() });
    if (how === 'saved') saved++;
    else if (how === 'shared') shared++;
    else if (how === 'cancelled') cancelled++;
    else opened++;
    /* Browsers rate-limit repeated downloads and will silently drop a burst.
       A gap between them is the difference between getting forty files and
       getting three. */
    if (i < list.length - 1) await wait(RACE_GAP);
  }

  if (stop) { stop.textContent = 'Download'; stop.onclick = null; updateRaceBar([]); }
  if (prog) {
    prog.textContent = raceAbort ? `Stopped after ${saved + opened + shared}.`
      : cancelled && !saved && !opened && !shared ? ''
      : opened && !saved ? `Opened ${opened} in new tabs — your browser blocked direct saving.`
      : opened ? `Saved ${saved}. ${opened} opened in a tab instead.`
      : shared ? '' : `Saved ${saved}.`;
    setTimeout(() => { if (prog.isConnected) prog.textContent = ''; }, 9000);
  }
  const bar = $('#race-bar'); if (bar) bar.classList.toggle('up', raceSel.size > 0);
}

/* ============================================================================
   THE FRONT PAGE

   Every photograph, piled onto one screen. The interesting problem here is
   not the scatter, it's the weight: ninety images all visible at once is
   the exact situation the rest of this file spends its effort avoiding.
   Down the flow, only the photographs near the viewport are ever attached;
   here they must all be attached at the same time.

   Three things keep it survivable.

   1. Tiles are small, and they ASK for small. A tile is a couple of
      hundred pixels wide, so `sizes` is set to its measured width and the
      browser draws 320 from the ladder instead of 1500. That's the
      difference between roughly 24 MB of decoded image and 8 GB.

   2. Only PILE_CONCURRENCY are in flight. Bunny speaks HTTP/2, which
      multiplexes freely — without a limit the browser opens all ninety at
      once and every one of them crawls. Eight at a time also produces the
      cascade you actually want to look at.

   3. pileGuard() — see below.
   ============================================================================ */

/* THE EMERGENCY BRAKE.

   Everything above assumes ?width= is honoured. If Bunny's Optimizer is
   off, it isn't: every request returns the 6192 x 4128 original, and
   ninety of those is about 200 MB of download and 8 GB of decoded bitmap.
   Safari on iOS doesn't degrade there, it dies.

   So the first image to arrive is measured. If it came back far larger
   than was asked for, the CDN is ignoring the parameter and the pile cuts
   itself down to PILE_RAW_CAP. The page stays up, and the console says
   plainly what happened and how to fix it.

   Turn the Optimizer on (or upload resized photographs) and this never
   fires — all ninety come back on their own. */
function pileGuard(img, want) {
  if (!img.naturalWidth) return false;
  const ignored = img.naturalWidth > Math.max(want * 2, 1200);
  if (ignored) {
    console.warn(
      `[pile] Asked the CDN for ~${want}px and got ${img.naturalWidth}px. ` +
      `Bunny's Optimizer is off, so every photograph is a full-size original. ` +
      `Showing ${PILE_RAW_CAP} instead of the full set to keep the page alive. ` +
      `Turn on Optimizer > Dynamic Image API, or upload resized files, and the ` +
      `rest will appear on their own.`);
  }
  return ignored;
}

function renderHome() {
  const el = document.createElement('div');
  el.className = 'pile';

  const field = document.createElement('div');
  field.className = 'pile-field';
  el.appendChild(field);

  /* A phone gets a subset. This is not a rendering limit — it's that
     thirty tiles is already a dense pile on a 390px screen, and ninety is
     neither legible nor affordable. */
  const coarse = mq('(pointer: coarse)').matches || window.innerWidth < 700;
  const list = coarse ? HOME.slice(0, PILE_MOBILE_MAX) : HOME.slice();

  /* Two randoms averaged rather than one. A single uniform random spreads
     tiles evenly to the edges, which reads as a sprinkle; averaging two
     pulls them towards the middle, which reads as a pile.

     The horizontal spread then widens with the shape of the screen. The
     same distribution on both axes gives a tidy central clump on a wide
     monitor with a third of the width left empty either side — correct on
     a phone, wrong on a laptop. The vertical spread stays tight, because
     that's the axis the pile actually reads along. */
  const shape   = Math.min(2, Math.max(1, window.innerWidth / Math.max(1, window.innerHeight)));
  const spreadX = Math.min(0.94, 0.82 * shape);
  const spreadY = 0.82;
  const middling = sp => (1 - sp) / 2 + ((Math.random() + Math.random()) / 2) * sp;
  const between  = (a,b) => a + Math.random() * (b - a);

  const chips = list.map((p, n) => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.type = 'button';
    btn.setAttribute('aria-label', `Open photograph ${pad(n+1)}`);
    btn.style.setProperty('--x', middling(spreadX).toFixed(4));
    btn.style.setProperty('--y', middling(spreadY).toFixed(4));
    btn.style.setProperty('--r', between(-9, 9).toFixed(2) + 'deg');
    btn.style.setProperty('--f', between(0.72, 1.34).toFixed(3));

    const img = document.createElement('img');
    img.alt = `Photograph ${pad(n+1)}`;   // never shown; a screen reader
    /* Which photograph this tile is, recorded before it loads. The flow
       does the same. It costs nothing and means a tile is identifiable
       while it's still queued behind the concurrency limit. */
    img.dataset.url = p.url;
    if (p.c)  img.style.setProperty('--c', p.c);
    if (p.ar) img.style.setProperty('--ar', p.ar);
    btn.appendChild(img);                 // still has to announce something
    field.appendChild(btn);
    btn.addEventListener('click', () => morph(img, () => openLB(list, n, img)));
    return { btn, img, p };
  });

  const tailEl = document.createElement('div');
  tailEl.className = 'pile-tail';
  tailEl.innerHTML = `<a class="h" href="#/photography">Photography &rarr;</a>`;
  el.appendChild(tailEl);

  /* The loader runs once the pile is in the document, because each tile's
     width has to be measured before it can be asked for at that size. */
  requestAnimationFrame(() => runPile(chips));
  return el;
}

/* THE LOADER.

   Eight photographs are in flight at a time, and each one that settles
   starts the next. The failure this shape is prone to — and did have — is
   that a request which never resolves takes its slot with it. Lose eight
   and the pile simply stops, part-loaded, with no error anywhere.

   Two things prevent that now.

   Tiles are marked `eager`. They were `lazy`, which is the browser's
   default for anything mount() isn't told about, and lazy loading decides
   for itself when an image is near enough to the viewport to bother with.
   These tiles are absolutely positioned, rotated, and inside an
   overflow:hidden box — the exact geometry those heuristics judge badly.
   A tile the browser decides to defer never fires `load`, so the slot was
   never given back. The queue is already the throttle here; the browser
   doesn't need to add a second opinion.

   And every slot has a deadline. Whatever happens — loaded, failed, or
   silently never answered — the slot is returned exactly once, and the
   tile is shown regardless. With average colours in the JSON a tile that
   times out still appears as its own colour and fills in later, so a slow
   photograph delays itself rather than everything behind it. */
function runPile(chips) {
  let started = 0, cap = chips.length, checked = false;
  const t0 = Date.now();

  const reveal = (c, i) => {
    const due = REDUCED ? 0 : Math.max(0, i * PILE_STAGGER - (Date.now() - t0));
    setTimeout(() => c.btn.classList.add('in'), due);
  };

  const next = () => {
    if (started >= Math.min(cap, chips.length)) return;
    const i = started++, c = chips[i];
    const want = Math.round(c.btn.getBoundingClientRect().width) || 200;

    /* Whichever of load / error / the deadline gets here first wins, and
       the other two become no-ops. This is the only place `next` is
       called from, so a slot can be neither lost nor handed back twice. */
    const settle = kind => {
      if (c.settled) return;
      c.settled = true;
      clearTimeout(c.timer);
      if (kind === 'error') c.btn.remove();
      else reveal(c, i);
      next();
    };

    c.img.addEventListener('load', () => {
      if (!checked) {
        checked = true;
        if (pileGuard(c.img, want)) {
          cap = Math.min(cap, PILE_RAW_CAP);
          chips.slice(cap).forEach(x => x.btn.remove());
        }
      }
      settle('load');
    }, { once:true });

    /* A photograph that won't load is removed rather than left as a broken
       frame. mount() has already told the renovation check about it, so if
       they ALL fail the site still falls back properly. */
    c.img.addEventListener('error', () => settle('error'), { once:true });

    c.timer = setTimeout(() => settle('timeout'), PILE_TIMEOUT);

    mount(c.img, c.p.url, { sizes: want + 'px', base: 640, eager: true, priority: 'auto' });
  };

  for (let k = 0; k < PILE_CONCURRENCY; k++) next();
}

function renderFlow(cat) {
  const live = CATEGORIES.filter(c => DATA.has(c.slug));
  const i = live.findIndex(c => c.slug === cat.slug);
  const next = live[(i + 1) % live.length];

  const el = document.createElement('div');
  el.appendChild(buildFlow(cat.photos));
  el.appendChild(next && next.slug !== cat.slug
    ? tail(`#/c/${next.slug}`, next.title)
    : tail('#/photography', 'Photography'));
  return el;
}

/* Written once and used by both the Information view and the fallback
   screen, so the two can never drift apart. */
const INFORMATION = `
    <p>Devin Feilen is a photographer based in Portland, Oregon.</p>
    <p><a class="h" href="mailto:dfeeilen@gmail.com">dfeeilen@gmail.com</a></p>
    <p><a class="h" href="https://instagram.com/devinfeilen" target="_blank" rel="noopener">instagram</a></p>
    <p><a class="h" href="https://buymeacoffee.com/devinfeilen" target="_blank" rel="noopener">buy me a coffee</a></p>`;

function renderInformation() {
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner">${INFORMATION}</div>`;
  return el;
}

function renderRenovation() {
  const el = document.createElement('div');
  el.className = 'reno';
  el.innerHTML = `
    <div class="reno-inner">
      <p>Under renovations</p>
      <button class="h reno-toggle" id="reno-contact" aria-expanded="false">Contact</button>
      <div class="reno-info" id="reno-info" hidden>${INFORMATION}</div>
    </div>`;
  const btn = $('#reno-contact', el), box = $('#reno-info', el);
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    if (open) { box.hidden = true; box.classList.remove('open'); }
    else { box.hidden = false; requestAnimationFrame(() => box.classList.add('open')); }
  });
  return el;
}

function renderMissing(msg) {
  const el = document.createElement('div');
  el.className = 'info';
  el.innerHTML = `<div class="info-inner"><p>${esc(msg)}</p>
    <p><a class="h" href="#/photography">Photography</a></p></div>`;
  return el;
}

/* ============================================================================
   LIGHTBOX

   srcset + sizes is the right tool for an image filling a known slice of
   the page, but it cannot describe this one: `sizes` only expresses a
   WIDTH, and a contained image is usually limited by HEIGHT. A portrait on
   a wide desktop displays at ~30vw while sizes:100vw tells the browser to
   fetch as though it were full-bleed — so it always pulled the largest
   file on the ladder no matter how small the window.

   The ratio is known, so the displayed size is computed and one exact file
   requested, snapped to the ladder so the CDN cache still works.
   ============================================================================ */
const lb = $('#lb'), lbImg = $('#lb-img'), lbSave = $('#lb-save');
/* Save only appears for race galleries. The portfolio isn't a download
   page, and a Save button on it would invite something it isn't offering. */
let lbCanSave = false;
let lbSource = null;   // the thumbnail this was opened from, for the morph back
const DPR_CAP = 2;
let lbList = [], lbi = 0, lastFocus = null, lockedY = 0, loadedLBWidth = 0;

/* iOS Safari ignores overflow:hidden on the root — the page keeps
   scrolling behind the overlay and you lose your place. Pinning the body
   at a negative offset is the only thing that holds. */
function lockScroll() {
  lockedY = window.scrollY || 0;
  const b = document.body;
  b.style.position='fixed'; b.style.top=`-${lockedY}px`;
  b.style.left='0'; b.style.right='0'; b.style.width='100%';
}
function unlockScroll() {
  const b = document.body;
  b.style.position=b.style.top=b.style.left=b.style.right=b.style.width='';
  window.scrollTo(0, lockedY);
}
function lbAvailable() {
  const el = $('.lb-body');
  if (!el || !el.clientWidth) return { w: innerWidth, h: innerHeight };
  const cs = getComputedStyle(el);
  const w = el.clientWidth  - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
  const h = el.clientHeight - parseFloat(cs.paddingTop||0)  - parseFloat(cs.paddingBottom||0);
  return { w: w>0?w:innerWidth, h: h>0?h:innerHeight };
}
function lbTargetWidth(f) {
  const a = lbAvailable(), arn = f.arn || 1.5;
  const cssW = Math.min(a.w, a.h * arn);
  const need = Math.ceil(cssW * Math.min(window.devicePixelRatio || 1, DPR_CAP));
  return WIDTHS.find(w => w >= need) || WIDTHS[WIDTHS.length - 1];
}
/* Runs `change` inside a view transition, with `el` and the lightbox image
   temporarily sharing a name so the browser morphs one into the other.
   Falls back to running `change` on its own wherever that isn't available. */
const canMorph = () =>
  typeof document.startViewTransition === 'function' && !REDUCED;

function morph(el, change) {
  if (!canMorph() || !el) { change(); return; }
  el.style.viewTransitionName = 'photo';
  lbImg.style.viewTransitionName = 'photo';
  const clear = () => {
    el.style.viewTransitionName = '';
    lbImg.style.viewTransitionName = '';
  };
  let t;
  try { t = document.startViewTransition(change); }
  catch (e) { clear(); change(); return; }
  /* finished rejects if the transition is skipped — a second one starting,
     or the tab going to the background. The DOM change has still happened,
     so this only ever needs to tidy up the names. */
  t.finished.then(clear, clear);
}

function openLB(list, i, from, savable) {
  if (!list || !list.length) return;
  lbList = list; lbi = i; lastFocus = document.activeElement;
  lbCanSave = !!savable;
  if (lbSave) lbSave.hidden = !lbCanSave;
  lbSource = from || null;
  lockScroll();
  lb.classList.add('open');
  requestAnimationFrame(() => lb.classList.add('shown'));
  drawLB(from && from.currentSrc ? from.currentSrc : (from && from.src) || null);
  $('#lb-close').focus();
}
function closeLB() {
  /* Morph back to the tile it came from, but only if that tile is still in
     the document — stepping to another photograph, or a re-render behind
     the lightbox, leaves nothing to return to, and then the plain fade is
     the honest thing to show. */
  const back = lbSource && lbSource.isConnected ? lbSource : null;
  if (back && canMorph()) {
    morph(back, () => {
      lb.classList.remove('shown');
      lb.classList.remove('open');
      unlockScroll();
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    });
    lbSource = null;
    return;
  }
  lb.classList.remove('shown');
  setTimeout(() => {
    lb.classList.remove('open');
    unlockScroll();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }, REDUCED ? 0 : 450);
}
function stepLB(d) { if (!lbList.length) return; lbi = (lbi + d + lbList.length) % lbList.length; lbSource = null; drawLB(); }
/* Whichever photographs sit either side of this one, fetched quietly so
   that Prev and Next are instant rather than a wait. Started only once the
   photograph you're actually looking at has arrived — otherwise the two
   you might never look at compete with it for bandwidth.

   Holding the Image objects in a variable is the point: drop the
   reference and some browsers will bin a decode that hasn't been used
   yet, which is exactly the one we're trying to keep. */
let lbNear = [];
function prefetchNeighbours() {
  if (lbList.length < 2) return;
  const want = [-1, 1]
    .map(d => lbList[(lbi + d + lbList.length) % lbList.length])
    .filter((f, i, a) => f && a.indexOf(f) === i && f !== lbList[lbi]);
  lbNear = want.map(f => {
    const im = new Image();
    im.decoding = 'async';
    if ('fetchPriority' in im) im.fetchPriority = 'low';
    im.src = sized(f.url, lbTargetWidth(f));
    return im;
  });
}

/* `seed` is the copy already on screen — the thumbnail you clicked. It's in
   cache, so it paints on the very next frame instead of after a round
   trip, and the full-size file then replaces it once it has decoded. Two
   things fall out of that: opening never shows an empty rectangle, and the
   view transition has something to morph into. */
let lbToken = 0;
function drawLB(seed) {
  const f = lbList[lbi]; if (!f) return;
  const mine = ++lbToken;
  lbImg.removeAttribute('srcset');
  lbImg.removeAttribute('sizes');
  lbImg.alt = `Photograph ${pad(lbi+1)}`;
  lbImg.decoding = 'async';
  lbImg.fetchPriority = 'high';
  loadedLBWidth = lbTargetWidth(f);
  const full = sized(f.url, loadedLBWidth);
  if (f.c) lbImg.style.setProperty('--c', f.c);

  const settle = () => { if (mine === lbToken) prefetchNeighbours(); };

  if (seed && seed !== full) {
    lbImg.src = seed;
    lbImg.classList.add('ready');
    const hi = new Image();
    hi.decoding = 'async';
    hi.addEventListener('load', () => {
      /* Only if you're still on this photograph, and still want this size —
         a resize may have raised the target while this was in flight. */
      if (mine === lbToken && lbList[lbi] === f) lbImg.src = full;
      settle();
    }, { once:true });
    hi.addEventListener('error', settle, { once:true });
    hi.src = full;
    return;
  }

  lbImg.classList.remove('ready');
  lbImg.src = full;
  const show = () => { lbImg.classList.add('ready'); settle(); };
  if (lbImg.complete && lbImg.naturalWidth) show();
  else { lbImg.addEventListener('load', show, {once:true});
         lbImg.addEventListener('error', show, {once:true}); }
}
if (lbSave) lbSave.addEventListener('click', async () => {
  const f = lbList[lbi]; if (!f) return;
  const was = lbSave.textContent;
  lbSave.disabled = true; lbSave.textContent = 'Saving…';
  const how = await downloadOne(f);
  lbSave.textContent = how === 'opened' ? 'Opened in a tab' : was;
  lbSave.disabled = false;
  if (how === 'opened') setTimeout(() => { lbSave.textContent = was; }, 4000);
});
$('#lb-close').addEventListener('click', closeLB);
$('#lb-prev').addEventListener('click', () => stepLB(-1));
$('#lb-next').addEventListener('click', () => stepLB(1));
lb.addEventListener('click', e => { if (e.target===lb || e.target.closest('.lb-body')) closeLB(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLB();
  if (e.key === 'ArrowLeft')  stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
  if (e.key === 'Tab') { e.preventDefault(); $('#lb-close').focus(); }
});
let tx=0, ty=0;
lb.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
lb.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>45) stepLB(dx>0?-1:1);
}, {passive:true});

let lbResizeTimer = null;
addEventListener('resize', () => {
  if (!lb.classList.contains('open')) return;
  clearTimeout(lbResizeTimer);
  lbResizeTimer = setTimeout(() => {
    const f = lbList[lbi]; if (!f) return;
    const need = lbTargetWidth(f);
    if (need > loadedLBWidth) { loadedLBWidth = need; lbImg.src = sized(f.url, need); }
  }, 250);
}, { passive:true });

/* ============================================================================
   ROUTER
     #/               the category list  (same as #/photography)
     #/photography    the category list
     #/c/<slug>       one category's flow
     #/information    contact
   ============================================================================ */
/* Categories that have been renamed keep their old address working. The
   folder on Bunny is still called Singles — only the word on screen and the
   URL changed, so there is nothing to re-upload. */
const RENAMED = { singles:'candids' };

function parseRoute() {
  const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!parts.length)              return { name:'home' };
  if (parts[0] === 'photography') return { name:'photography' };
  if (parts[0] === 'information') return { name:'information' };
  if (parts[0] === 'c')           return { name:'category', slug: RENAMED[parts[1]] || parts[1] };
  /* Race galleries. Unlisted: nothing links here, nothing lists them, and a
     hash fragment is never sent to a server, so the address cannot be
     indexed as a page of its own. That is obscurity, not security — the
     reasoning is written out in RACES.md. */
  if (parts[0] === 'r' && parts[1])
    return { name:'race', slug: parts[1].replace(/[^a-z0-9-]/gi,'').toLowerCase() };
  // #/w/racing and friends were real URLs once; send them somewhere real.
  if (parts[0] === 'w')           return { name:'category', slug: parts[1] };
  return { name:'missing' };
}

let current = '';
async function route() {
  const r = parseRoute();
  const key = JSON.stringify(r);
  if (key === current) return;
  current = key;

  // PHOTOGRAPHY stays lit while you're inside a category.
  const navKey = r.name === 'category' ? 'photography' : r.name;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));

  view.classList.add('out');
  await wait(REDUCED ? 0 : 340);

  let el;
  if (RENOVATING && r.name !== 'information' && r.name !== 'race') {
    el = renderRenovation();
  } else if (r.name === 'information') {
    el = renderInformation();
  } else if (r.name === 'home') {
    el = renderHome();
  } else if (r.name === 'photography') {
    el = renderCategories();
  } else if (r.name === 'category') {
    const cat = DATA.get(r.slug);
    el = cat ? renderFlow(cat) : renderMissing('No such category.');
  } else if (r.name === 'race') {
    el = renderRaceLoading();
  } else {
    el = renderMissing('That page does not exist.');
  }

  if (windowIO) { windowIO.disconnect(); windowIO = null; }
  if (raceIO)   { raceIO.disconnect();   raceIO = null; }
  swapIn(view, el);
  scrollTo({ top:0, behavior:'auto' });
  const hasFlow = !RENOVATING &&
    (r.name === 'home' || (r.name === 'category' && DATA.get(r.slug)));
  if (hasFlow) initWindowing(view);

  requestAnimationFrame(() => view.classList.remove('out'));
  /* The gallery's own file is fetched after the view is on screen, so a
     500-photograph manifest never delays the frame. */
  if (r.name === 'race') mountRace(r.slug, el);
  const cat = r.name === 'category' && DATA.get(r.slug);
  document.title = cat ? `${cat.title} — Devin Feilen`
    : r.name === 'information' ? 'Information — Devin Feilen'
    : r.name === 'race' ? 'Gallery — Devin Feilen' : 'Devin Feilen';
}
addEventListener('hashchange', route);

/* ============================================================================
   THEME — warm light is the default, so the button offers Dark mode
   ============================================================================ */
const themeBtn = $('#theme');
const root = document.documentElement;
let themingTimer = null;

/* `animate` is only true for a deliberate toggle. On first load the theme
   is already correct, so there is nothing to fade and nothing should. */
function applyTheme(t, animate) {
  if (animate) {
    root.classList.add('theming');
    clearTimeout(themingTimer);
    themingTimer = setTimeout(() => root.classList.remove('theming'), 520);
  }
  if (t === 'dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  themeBtn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  const m = $('meta[name="theme-color"]');
  if (m) m.content = t === 'dark' ? '#0a0a0a' : '#EAE7E2';
}
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch(_) {}
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(theme, true);
  try { localStorage.setItem('theme', theme); } catch(_) {}
});

/* ============================================================================
   BOOT
   ============================================================================ */
(async function init() {
  const loaded = await Promise.all(CATEGORIES.map(async c => {
    const parts = await Promise.all(c.sources.map(loadFile));
    const photos = parts.flat();
    /* Shuffled here, once, rather than inside renderFlow() — for the same
       reason the front page is. If it happened at render time, every trip
       back into a category would reorder it under you, and the lightbox's
       Prev/Next would disagree with the page behind it. Shuffling at load
       means an order that holds for the whole visit and changes on reload.

       This also means order in the JSON file no longer decides anything.
       Which photographs are in the file is now the only editorial control
       left — so the argument for keeping each list short gets stronger,
       not weaker. */
    return photos.length ? { ...c, photos: shuffle(photos) } : null;
  }));
  loaded.filter(Boolean).forEach(c => DATA.set(c.slug, c));

  if (!DATA.size) { declareRenovation('no photo lists loaded'); return; }

  /* The race index is tiny and optional. If it isn't there, or is empty,
     the button simply doesn't appear — same rule as a missing category. */
  try {
    const res = await fetch('races/index.json', { cache:'no-cache' });
    if (res.ok) {
      const list = await res.json();
      if (Array.isArray(list)) {
        RACES = list.filter(r => r && r.slug && r.title)
                    .map(r => ({ slug:String(r.slug), title:String(r.title),
                                 date:r.date ? String(r.date) : '', soon: !!r.soon }));
      }
    }
  } catch (e) { /* no galleries, no button */ }

  const everything = [].concat(...[...DATA.values()].map(c => c.photos));

  /* Every photograph, in one shuffled order. Shuffled once here rather
     than inside renderHome() so that returning to the front page shows the
     pile you left rather than rebuilding a different one. A reload
     scatters it afresh. */
  HOME = shuffle(everything);

  /* Render straight away. The probe must never sit between a visitor and
     the work — on a slow connection that would be seconds of nothing for
     a site that is perfectly fine. It runs alongside instead. */
  route();

  cdnAnswering(probeUrls(everything)).then(alive => {
    if (!alive) declareRenovation('no photograph on the CDN answered');
  });
})();
})();
</script>
